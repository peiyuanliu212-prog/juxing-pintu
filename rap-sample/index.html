<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>篮球有嘻哈 · 小样试玩 v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#efe6d0; color:#2b2118; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:430px; margin:0 auto; padding:14px 12px 40px; }
  .kicker { text-align:center; color:#b3352c; font-weight:700; letter-spacing:4px; font-size:12px; margin-top:8px; }
  h1 { text-align:center; font-size:30px; letter-spacing:2px; margin:4px 0 2px; font-family:"Songti SC","SimSun",serif; }
  .sub { text-align:center; color:#6b5a44; font-size:13px; line-height:1.6; margin-bottom:12px; }
  .card { background:#fffdf7; border:1.5px solid #d8c9a8; border-radius:10px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(90,70,30,.12); }
  .btn { display:block; width:100%; background:#b3352c; color:#fff; border:none; border-radius:8px; padding:13px; font-size:16px; font-weight:700; letter-spacing:2px; cursor:pointer; }
  .btn:active { opacity:.85; }
  .btn.ghost { background:#fffdf7; color:#b3352c; border:1.5px solid #b3352c; }
  .btn.small { padding:9px; font-size:14px; }
  .dims { display:flex; flex-wrap:wrap; gap:5px; }
  .slot { flex:0 0 calc(25% - 4px); background:#f4ecd9; border:1px solid #ddd0ae; border-radius:6px; padding:5px 2px; text-align:center; }
  .slot.filled { background:#2b2118; color:#f4ecd9; border-color:#2b2118; }
  .slot .dn { font-size:11px; opacity:.75; }
  .slot .dv { font-size:16px; font-weight:800; line-height:1.15; }
  .slot .ds { font-size:8.5px; opacity:.65; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog { text-align:center; font-weight:700; font-size:15px; margin:8px 0; }
  .prog span { color:#b3352c; }
  .pcard { display:flex; gap:10px; align-items:center; background:#fffdf7; border:1.5px solid #d8c9a8; border-radius:10px; padding:9px; margin-bottom:8px; cursor:pointer; }
  .pcard.sel { border-color:#b3352c; box-shadow:0 0 0 1.5px #b3352c; }
  .pcard img { width:52px; height:52px; border-radius:8px; object-fit:cover; background:#e8dcbc; }
  .pcard .pn { font-weight:800; font-size:15px; }
  .pcard .pt { color:#8a7757; font-size:11px; }
  .pcard .ptop { color:#6b5a44; font-size:11px; margin-top:2px; }
  .detail { background:#2b2118; color:#f4ecd9; border-radius:10px; padding:12px; margin-bottom:10px; }
  .detail .dt { font-weight:800; margin-bottom:8px; font-size:15px; }
  .chip { flex:0 0 calc(25% - 4px); background:#453723; color:#f4ecd9; border:1px solid #6b573a; border-radius:6px; padding:6px 2px; text-align:center; cursor:pointer; }
  .chip:active { background:#b3352c; }
  .chip.off { opacity:.32; cursor:default; }
  .chip .cv { font-size:16px; font-weight:800; }
  .chip .cn { font-size:11px; opacity:.8; }
  .hint { background:#fdf3d8; border:1px dashed #c9a227; color:#7a5b12; border-radius:8px; padding:9px; font-size:13px; margin-bottom:10px; text-align:center; font-weight:700; }
  .vs { text-align:center; font-size:15px; line-height:1.9; }
  .vs .big { font-size:22px; font-weight:800; }
  .win { color:#b3352c; font-weight:800; }
  .tactic { text-align:left; background:#fffdf7; border:1.5px solid #d8c9a8; border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer; width:100%; font-family:inherit; color:inherit; }
  .tactic:active { border-color:#b3352c; }
  .tactic .tn { font-weight:800; font-size:16px; }
  .tactic .td { color:#6b5a44; font-size:12px; margin-top:2px; line-height:1.5; }
  .tactic .tv { color:#b3352c; font-weight:700; font-size:12px; margin-top:3px; }
  .evt { background:#2b2118; color:#f4ecd9; border-radius:10px; padding:14px 12px; margin-bottom:10px; }
  .evt .et { font-weight:800; font-size:16px; margin-bottom:6px; }
  .evt .ex { font-size:13px; line-height:1.7; opacity:.92; margin-bottom:10px; }
  .evt .tactic { background:#453723; border-color:#6b573a; color:#f4ecd9; }
  .evt .tactic .td { color:#d8c9a8; }
  .evt .tactic .tv { color:#f0b429; }
  .rowbtn { display:flex; gap:8px; } .rowbtn .btn { flex:1; }
  .end-name { text-align:center; font-size:26px; font-weight:800; font-family:"Songti SC","SimSun",serif; margin:6px 0; }
  .pcard { position:relative; overflow:hidden; }
  .pcard.pop { animation:pop .35s ease; }
  @keyframes pop { 0%{transform:scale(.96)} 60%{transform:scale(1.02)} 100%{transform:scale(1)} }
  .pcard.gold { border:2px solid #c9a227; background:linear-gradient(135deg,#fff8dc,#f7e08a 55%,#fff3c4); }
  .pcard.gold img { box-shadow:0 0 0 2px #c9a227, 0 0 10px rgba(201,162,39,.75); }
  .pcard.gold::after { content:''; position:absolute; top:-60%; left:-90%; width:45%; height:220%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:rotate(20deg); animation:shine 2.8s ease-in-out infinite; pointer-events:none; }
  @keyframes shine { 0%{left:-90%} 55%{left:140%} 100%{left:140%} }
  .pcard.epic { border-color:#7b4bb7; background:#f6efff; }
  .pcard.rare { border-color:#4a7dbb; background:#eef5ff; }
  .pcard.guest { border:1.5px dashed #3f9e4d; background:#effbea; }
  .badge { font-size:10px; font-weight:800; padding:1px 6px; border-radius:8px; margin-left:6px; vertical-align:2px; color:#fff; }
  .badge.g { background:#c9a227; } .badge.e { background:#7b4bb7; } .badge.r { background:#4a7dbb; } .badge.gu { background:#3f9e4d; }
  .foot { text-align:center; color:#a08c66; font-size:11px; margin-top:14px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="rap_config.js"></script>
<script src="rap_data.js"></script>
<script src="rap_formulas.js"></script>
<script>
(function(){
  var DIMS = RAP_CONFIG.dims, PLAYERS = window.RAP_DATA.players;
  var app = document.getElementById('app');
  var S = null;

  function newGame(){
    var seed = (Date.now() % 100000000) + Math.floor(Math.random()*1000);
    S = { phase:'intro', seed:seed, rngState:seed, draftIdx:0, swaps:RAP_CONFIG.swapsPerGame,
          attrs:Array(12).fill(null), src:Array(12).fill(null), used:[], options:[], sel:-1,
          battleIdx:0, wins:0, battleLog:[], bonusNext:0, eventPending:-1, eventLog:[] };
    save(); render();
  }
  function rng(){
    S.rngState = (S.rngState * 1664525 + 1013904223) >>> 0;
    return (S.rngState >>> 8) / 16777216;
  }
  function save(){ try{ sessionStorage.setItem(RAP_CONFIG.sessionKey, JSON.stringify(S)); }catch(e){} }
  function load(){
    try{ var s = sessionStorage.getItem(RAP_CONFIG.sessionKey); if(s){ S = JSON.parse(s); return true; } }catch(e){}
    return false;
  }
  function drawOptions(){
    // v2 rule: a player already drafted from can never appear again this game.
    var usedSet = {};
    S.used.forEach(function(i){ usedSet[i] = 1; });
    var idx = new Set();
    while(idx.size < RAP_CONFIG.draftOptions){
      var i = Math.floor(rng()*PLAYERS.length);
      if(!usedSet[i]) idx.add(i);
    }
    S.options = Array.from(idx); S.sel = -1;
  }
  function topDims(p){
    return p.rap.map(function(v,i){return [v,i];}).sort(function(a,b){return b[0]-a[0];}).slice(0,3)
      .map(function(x){ return DIMS[x[1]] + x[0]; }).join(' · ');
  }
  function slotsHTML(){
    var h = '<div class="dims">';
    for(var i=0;i<12;i++){
      var f = S.attrs[i] !== null;
      h += '<div class="slot' + (f?' filled':'') + '"><div class="dn">' + DIMS[i] + '</div><div class="dv">' +
           (f ? S.attrs[i] : '—') + '</div><div class="ds">' + (f ? S.src[i] : '待夺') + '</div></div>';
    }
    return h + '</div>';
  }
  function header(){
    return '<div class="kicker">小 样 试 玩 · v2</div><h1>篮球有嘻哈</h1><div class="sub">从 114 位选手身上，夺走 12 项说唱本事<br>拼到一个无名新秀身上，再去打三回合 Battle</div>';
  }
  function render(){
    if(S.phase === 'intro'){
      app.innerHTML = header() +
        '<div class="card"><b>怎么玩</b><br><span style="font-size:13px;line-height:1.8;color:#6b5a44">12 轮选人，每轮从 5 位球星里挑 1 人、夺走他的一项能力。<b>选过的人不会再出现</b>，每一次出手都要算好。S 级以上是<b style="color:#b8860b">金卡「传说」</b>，出场自带闪光，看见金卡先抢再说。候选里偶尔还会混进一些……奇奇怪怪的嘉宾。夺满后打 3 回合 Battle：每回合先选打法（用你最硬的那一面打），回合之间还有现场插曲要你拿主意。<br>小提示：有一项能力，有个人是 <b style="color:#b3352c">99</b>，全场没人够得着。看见他，别手软。</span></div>' +
        '<div class="card">' + slotsHTML() + '</div>' +
        '<button class="btn" id="b-start">开始拼人</button>' +
        '<div class="foot">内部小样 · 不计榜单 · 玩完说一句好不好玩就行</div>';
      document.getElementById('b-start').onclick = function(){ S.phase='draft'; drawOptions(); save(); render(); };
    }
    else if(S.phase === 'draft'){ renderDraft(); }
    else if(S.phase === 'battle'){ renderBattle(); }
    else if(S.phase === 'end'){ renderEnd(); }
  }
  function tierClass(p){
    if(p.team === '整活嘉宾队' && p.tier !== 'SS' && p.tier !== 'S') return 'guest';
    if(p.tier === 'SS' || p.tier === 'S') return 'gold';
    if(p.tier === 'A') return 'epic';
    if(p.tier === 'B') return 'rare';
    return '';
  }
  function tierBadge(p){
    var c = tierClass(p);
    if(c === 'gold') return '<span class="badge g">传说</span>';
    if(c === 'epic') return '<span class="badge e">史诗</span>';
    if(c === 'guest') return '<span class="badge gu">整活</span>';
    return '';
  }
  var QUIPS = { '库里 · 绿发版':'他来了——头发是绿的，格局是满的。', 'PG ONE':'？？？候选里混进来一个真唱的', '阿耶莎':'？？？她怎么也来了（手里还拿着菜谱）', '假乃亮':'郑重声明：这位是假的，和本人没关系', '李小鹿':'？？？候选里混进了一只鹿', '张驰 · 库里yyds昂':'甲方本人亲自下场了，这把得给他个面子' };
  function renderDraft(){
    var h = header() + '<div class="prog">第 <span>' + (S.draftIdx+1) + '</span> / 12 轮夺技 · 还剩换一批 <span>' + S.swaps + '</span> 次</div>';
    h += '<div class="card">' + slotsHTML() + '</div>';
    var quip = null;
    S.options.forEach(function(pi){ var nm = PLAYERS[pi].name; if(!quip && QUIPS[nm]) quip = QUIPS[nm]; });
    if(quip) h += '<div class="hint">' + quip + '</div>';
    if(S.sel >= 0){
      var p = PLAYERS[S.options[S.sel]];
      if(p.name === '库里 · 绿发版' && S.attrs[11] === null){
        h += '<div class="hint">格局 · 99 —— 这一项，全场没人够得着。</div>';
      }
      h += '<div class="detail"><div class="dt">' + p.name + tierBadge(p) + ' · 点一项能力夺走（夺走后他不会再出现）</div><div class="dims">';
      for(var i=0;i<12;i++){
        var off = S.attrs[i] !== null;
        h += '<div class="chip' + (off?' off':'') + '" data-dim="' + i + '"><div class="cn">' + DIMS[i] + '</div><div class="cv">' + p.rap[i] + '</div></div>';
      }
      h += '</div></div>';
    } else {
      h += '<div class="sub">先点一位球星，看他的 12 项说唱能力</div>';
    }
    S.options.forEach(function(pi, oi){
      var p = PLAYERS[pi];
      h += '<div class="pcard pop ' + tierClass(p) + (S.sel===oi?' sel':'') + '" data-pick="' + oi + '"><img src="portraits/' + p.portrait + '" alt=""><div><div class="pn">' + p.name + tierBadge(p) + '</div><div class="pt">' + p.team + ' · ' + p.note + '</div><div class="ptop">' + topDims(p) + '</div></div></div>';
    });
    h += '<div class="rowbtn"><button class="btn ghost small" id="b-swap"' + (S.swaps<=0?' disabled style="opacity:.4"':'') + '>换一批</button><button class="btn ghost small" id="b-restart">重开</button></div>';
    app.innerHTML = h;
    app.querySelectorAll('[data-pick]').forEach(function(el){
      el.onclick = function(){ S.sel = parseInt(el.getAttribute('data-pick'),10); save(); render(); };
    });
    app.querySelectorAll('[data-dim]').forEach(function(el){
      el.onclick = function(){
        var d = parseInt(el.getAttribute('data-dim'),10);
        if(S.attrs[d] !== null) return;
        var pi = S.options[S.sel], p = PLAYERS[pi];
        S.attrs[d] = p.rap[d]; S.src[d] = p.name;
        S.used.push(pi);
        S.draftIdx++;
        if(S.draftIdx >= 12){ S.phase = 'battle'; }
        else { drawOptions(); }
        save(); render();
      };
    });
    var sw = document.getElementById('b-swap');
    if(sw) sw.onclick = function(){ if(S.swaps>0){ S.swaps--; drawOptions(); save(); render(); } };
    document.getElementById('b-restart').onclick = function(){ sessionStorage.removeItem(RAP_CONFIG.sessionKey); newGame(); };
  }
  function dimLabel(dims){
    if(dims === 'ALL') return '12 维总评';
    return dims.map(function(d){ return DIMS[d]; }).join('＋');
  }
  function renderBattle(){
    var h = header() + '<div class="card"><div class="prog" style="margin-top:0">你的拼将 · 总评 <span>' + RapFormulas.total(S.attrs) + '</span></div>' + slotsHTML() + '</div>';
    S.battleLog.forEach(function(L){
      h += '<div class="card vs">' + L.name + ' · ' + L.tactic + '<br><span class="big">' + L.mine.toFixed(1) + ' : ' + L.opp.toFixed(1) + '</span><br>' + (L.win ? '<span class="win">拿下这一回合</span>' : '这一回合输了') + '</div>';
    });
    S.eventLog.forEach(function(E){
      h += '<div class="hint" style="text-align:left">' + E + '</div>';
    });
    if(S.eventPending >= 0){
      var ev = RAP_CONFIG.events[S.eventPending];
      h += '<div class="evt"><div class="et">' + ev.title + '</div><div class="ex">' + ev.text + '</div>';
      ev.choices.forEach(function(c, ci){
        h += '<button class="tactic" data-evt="' + ci + '"><div class="tn">' + c.name + '</div><div class="td">' + c.desc + '</div>' +
             (c.dims ? '<div class="tv">你这一项：' + c.dims.map(function(d){ return DIMS[d] + S.attrs[d]; }).join(' / ') + '（门槛 ' + c.threshold + '）</div>' : '') + '</button>';
      });
      h += '</div>';
      app.innerHTML = h;
      app.querySelectorAll('[data-evt]').forEach(function(el){
        el.onclick = function(){
          var c = ev.choices[parseInt(el.getAttribute('data-evt'),10)];
          var r = RapFormulas.eventResult(S.attrs, c, rng);
          S.bonusNext = r.bonus;
          S.eventLog.push(ev.title.split(' · ')[1] + '：你选了「' + c.name + '」——' + (c.dims ? (r.ok ? '成了，下一回合 +' : '没成，下一回合 ') + r.bonus : '下一回合 +' + r.bonus));
          S.eventPending = -1;
          save(); render();
        };
      });
      return;
    }
    if(S.battleIdx < RAP_CONFIG.battles.length){
      var b = RAP_CONFIG.battles[S.battleIdx];
      h += '<div class="card vs"><b>' + b.name + '</b><br><span style="color:#6b5a44;font-size:13px">' + b.desc + '</span><br>对手：' + b.oppName + '（基准 ' + b.oppBase + '）' + (S.bonusNext ? ' · 插曲加成 <b style="color:#b3352c">' + (S.bonusNext>0?'+':'') + S.bonusNext + '</b>' : '') + '</div>';
      h += '<div class="sub">选一个打法开麦：</div>';
      b.tactics.forEach(function(t, ti){
        var mine = RapFormulas.composite(S.attrs, t.dims);
        h += '<button class="tactic" data-tac="' + ti + '"><div class="tn">' + t.name + '</div><div class="td">' + t.desc + '</div><div class="tv">' + dimLabel(t.dims) + '：你的数值 ' + mine.toFixed(0) + (t.oppMod ? ' · 对手 +' + t.oppMod : '') + '</div></button>';
      });
      app.innerHTML = h;
      app.querySelectorAll('[data-tac]').forEach(function(el){
        el.onclick = function(){
          var t = b.tactics[parseInt(el.getAttribute('data-tac'),10)];
          var r = RapFormulas.battleRound(S.attrs, b, t, rng, S.bonusNext);
          S.battleLog.push({ name:b.name, tactic:t.name, mine:r.mine, opp:r.opp, win:r.win });
          if(r.win) S.wins++;
          S.bonusNext = 0;
          var bi = S.battleIdx;
          S.battleIdx++;
          var evIdx = RAP_CONFIG.events.findIndex(function(e){ return e.after === bi; });
          if(evIdx >= 0 && S.battleIdx < RAP_CONFIG.battles.length) S.eventPending = evIdx;
          if(S.battleIdx >= RAP_CONFIG.battles.length && S.eventPending < 0) S.phase = 'end';
          save(); render();
        };
      });
      return;
    }
    app.innerHTML = h;
  }
  function renderEnd(){
    var e = RAP_CONFIG.endings.filter(function(x){ return x.wins === S.wins; })[0];
    var h = header() + '<div class="card"><div class="sub" style="margin-bottom:2px">三回合战绩 ' + S.wins + ' 胜 · 总评 ' + RapFormulas.total(S.attrs) + '</div><div class="end-name">' + e.name + '</div><div class="sub">' + e.desc + '</div>' + slotsHTML() + '</div>';
    if(S.src[11] === '库里 · 绿发版'){
      h += '<div class="hint">你抢到了格局 99——决胜回合的秘密武器，被你拿到了。</div>';
    }
    h += '<button class="btn" id="b-again">再来一局</button><div class="foot">截图这张结算，发回去说一句：好玩 / 一般 / 没意思<br>你的反馈决定这个模式做不做下去</div>';
    app.innerHTML = h;
    document.getElementById('b-again').onclick = function(){ sessionStorage.removeItem(RAP_CONFIG.sessionKey); newGame(); };
  }
  if(!load() || !S){ newGame(); } else { render(); }
})();
</script>
</body>
</html>
