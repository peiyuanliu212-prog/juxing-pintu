<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>篮球有嘻哈 · 二十章巡演</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#efe6d0; color:#2b2118; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:430px; margin:0 auto; padding:14px 12px 40px; }
  .kicker { text-align:center; color:#b3352c; font-weight:700; letter-spacing:4px; font-size:12px; margin-top:8px; }
  h1 { text-align:center; font-size:30px; letter-spacing:2px; margin:4px 0 2px; font-family:"Songti SC","SimSun",serif; }
  .sub { text-align:center; color:#6b5a44; font-size:13px; line-height:1.6; margin-bottom:12px; }
  .card { background:#fffdf7; border:1.5px solid #d8c9a8; border-radius:10px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(90,70,30,.12); }
  .btn { display:block; width:100%; background:#b3352c; color:#fff; border:none; border-radius:8px; padding:13px; font-size:16px; font-weight:700; letter-spacing:2px; cursor:pointer; }
  .btn:active { opacity:.85; }
  .btn.ghost { background:#fffdf7; color:#b3352c; border:1.5px solid #b3352c; }
  .btn.small { padding:9px; font-size:14px; }
  .dims { display:flex; flex-wrap:wrap; gap:5px; }
  .slot { flex:0 0 calc(25% - 4px); background:#f4ecd9; border:1px solid #ddd0ae; border-radius:6px; padding:5px 2px; text-align:center; }
  .slot.filled { background:#2b2118; color:#f4ecd9; border-color:#2b2118; }
  .slot .dn { font-size:11px; opacity:.75; }
  .slot .dv { font-size:16px; font-weight:800; line-height:1.15; }
  .slot .ds { font-size:8.5px; opacity:.65; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog { text-align:center; font-weight:700; font-size:15px; margin:8px 0; }
  .prog span { color:#b3352c; }
  .pcard { display:flex; gap:10px; align-items:center; background:#fffdf7; border:1.5px solid #d8c9a8; border-radius:10px; padding:9px; margin-bottom:8px; cursor:pointer; }
  .pcard.sel { border-color:#b3352c; box-shadow:0 0 0 1.5px #b3352c; }
  .pcard img { width:52px; height:52px; border-radius:8px; object-fit:cover; background:#e8dcbc; }
  .pcard .pn { font-weight:800; font-size:15px; }
  .pcard .pt { color:#8a7757; font-size:11px; }
  .pcard .ptop { color:#6b5a44; font-size:11px; margin-top:2px; }
  .detail { background:#2b2118; color:#f4ecd9; border-radius:10px; padding:12px; margin-bottom:10px; }
  .detail .dt { font-weight:800; margin-bottom:8px; font-size:15px; line-height:1.5; }
  .chip { flex:0 0 calc(25% - 4px); background:#453723; color:#f4ecd9; border:1px solid #6b573a; border-radius:6px; padding:6px 2px; text-align:center; cursor:pointer; }
  .chip:active { background:#b3352c; }
  .chip.off { opacity:.32; cursor:default; }
  .chip .cv { font-size:16px; font-weight:800; }
  .chip .cn { font-size:11px; opacity:.8; }
  .hint { background:#fdf3d8; border:1px dashed #c9a227; color:#7a5b12; border-radius:8px; padding:9px; font-size:13px; margin-bottom:10px; text-align:center; font-weight:700; line-height:1.6; }
  .vs { text-align:center; font-size:15px; line-height:1.9; }
  .vs .big { font-size:22px; font-weight:800; }
  .win { color:#b3352c; font-weight:800; }
  .tactic { text-align:left; background:#fffdf7; border:1.5px solid #d8c9a8; border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer; width:100%; font-family:inherit; color:inherit; }
  .tactic:active { border-color:#b3352c; }
  .tactic .tn { font-weight:800; font-size:16px; }
  .tactic .td { color:#6b5a44; font-size:12px; margin-top:2px; line-height:1.5; }
  .tactic .tv { color:#b3352c; font-weight:700; font-size:12px; margin-top:3px; }
  .evt { background:#2b2118; color:#f4ecd9; border-radius:10px; padding:14px 12px; margin-bottom:10px; }
  .evt .et { font-weight:800; font-size:16px; margin-bottom:6px; }
  .evt .ex { font-size:13px; line-height:1.7; opacity:.92; margin-bottom:10px; }
  .evt .tactic { background:#453723; border-color:#6b573a; color:#f4ecd9; }
  .evt .tactic .td { color:#d8c9a8; }
  .evt .tactic .tv { color:#f0b429; }
  .rowbtn { display:flex; gap:8px; } .rowbtn .btn { flex:1; }
  .end-name { text-align:center; font-size:26px; font-weight:800; font-family:"Songti SC","SimSun",serif; margin:6px 0; }
  .pcard { position:relative; overflow:hidden; }
  .pcard.pop { animation:pop .35s ease; }
  @keyframes pop { 0%{transform:scale(.96)} 60%{transform:scale(1.02)} 100%{transform:scale(1)} }
  .pcard.gold { border:2px solid #c9a227; background:linear-gradient(135deg,#fff8dc,#f7e08a 55%,#fff3c4); }
  .pcard.gold img { box-shadow:0 0 0 2px #c9a227, 0 0 10px rgba(201,162,39,.75); }
  .pcard.king { border-width:3px; }
  .pcard.king img { box-shadow:0 0 0 3px #c9a227, 0 0 16px rgba(201,162,39,.95); }
  .pcard.gold::after, .pcard.diamond::after { content:''; position:absolute; top:-60%; left:-90%; width:45%; height:220%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:rotate(20deg); animation:shine 2.8s ease-in-out infinite; pointer-events:none; }
  @keyframes shine { 0%{left:-90%} 55%{left:140%} 100%{left:140%} }
  .pcard.epic { border-color:#7b4bb7; background:#f6efff; }
  .pcard.rare { border-color:#4a7dbb; background:#eef5ff; }
  .pcard.pink { border:2px solid #d63384; background:linear-gradient(135deg,#ffe9f3,#ffc2d9 60%,#ffe9f3); }
  .pcard.pink img { box-shadow:0 0 0 2px #d63384, 0 0 8px rgba(214,51,132,.5); }
  .pcard.green { border:2.5px solid #22c55e; background:linear-gradient(135deg,#f2fff3,#8bf79b 45%,#c9ffd1 70%,#8bf79b); box-shadow:0 0 14px rgba(34,197,94,.55), inset 0 0 18px rgba(255,255,255,.65); }
  .pcard.green img { box-shadow:0 0 0 2.5px #22c55e, 0 0 14px rgba(34,197,94,.9); }
  .pcard.green::after { content:''; position:absolute; top:-60%; left:-90%; width:45%; height:220%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent); transform:rotate(20deg); animation:shine 2.2s ease-in-out infinite; pointer-events:none; }
  .pcard.orange { border:2.5px solid #f97316; background:linear-gradient(135deg,#fff7ed,#fdba74 45%,#ffedd5 70%,#fdba74); box-shadow:0 0 14px rgba(249,115,22,.55), inset 0 0 18px rgba(255,255,255,.6); }
  .pcard.orange::after { content:''; position:absolute; top:-60%; left:-90%; width:45%; height:220%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent); transform:rotate(20deg); animation:shine 2.4s ease-in-out infinite; pointer-events:none; }
  .badge.o { background:#f97316; color:#fff; }
  .chip.extra { background:linear-gradient(135deg,#ffb066,#f97316); border-color:#ea580c; color:#fff; }
  .chip.extra .cn { color:#fff; }
  .pcard.diamond { border:2px solid #2fb9d8; background:linear-gradient(135deg,#f2feff,#bdeef8 55%,#f2feff); }
  .pcard.diamond img { box-shadow:0 0 0 2px #2fb9d8, 0 0 12px rgba(47,185,216,.8); }
  .badge { font-size:10px; font-weight:800; padding:1px 6px; border-radius:8px; margin-left:6px; vertical-align:2px; color:#fff; }
  .badge.g { background:#c9a227; } .badge.e { background:#7b4bb7; } .badge.r { background:#4a7dbb; } .badge.dia { background:#2fb9d8; }
  .chip.extra { flex:0 0 100%; background:linear-gradient(135deg,#8a5a12,#c9962e); border-color:#f0b429; color:#fff8dc; }
  .chip.extra .cv { color:#ffe9a8; }
  .arcimg { width:100%; border-radius:10px; display:block; margin-bottom:10px; box-shadow:0 2px 8px rgba(90,70,30,.25); }
  .chtitle { text-align:center; font-size:24px; font-weight:800; font-family:"Songti SC","SimSun",serif; margin:2px 0 4px; }
  .chintro { font-size:14px; line-height:1.85; color:#4a3a26; }
  .logrow { display:flex; justify-content:space-between; font-size:12px; padding:4px 2px; border-bottom:1px dashed #e2d3ac; }
  .foot { text-align:center; color:#a08c66; font-size:11px; margin-top:14px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="rap_config.js"></script>
<script src="rap_data.js"></script>
<script src="rap_formulas.js"></script>
<script>
(function(){
  var CFG = RAP_CONFIG, DIMS = CFG.dims, PLAYERS = window.RAP_DATA.players;
  var app = document.getElementById('app');
  var S = null;
  var MYSTERY = '张驰';

  function newGame(){
    var seed = (Date.now() % 100000000) + Math.floor(Math.random()*1000);
    S = { phase:'intro', seed:seed, rngState:seed, draftIdx:0, rerolls:CFG.rerolls,
          attrs:Array(12).fill(null), src:Array(12).fill(null), used:[], options:[], sel:-1,
          chapter:0, wins:0, chapterLog:[], bonusNext:0, eventIdx:-1, usedEvents:[],
          resupplyLeft:0, replaced:[], lastResult:null, eventLog:[], acting:false, evResult:null,
          pickLog:[], bonds:{}, bondNotes:[], iceUsed:false, actingX2:false, foeMarks:{}, befriended:{}, ads:{ reroll:0, consol:0, resup:0, evredo:0, befriend:0 } };
    save(); render();
  }
  function rng(){
    S.rngState = (S.rngState * 1664525 + 1013904223) >>> 0;
    return (S.rngState >>> 8) / 16777216;
  }
  function save(){ try{ sessionStorage.setItem(CFG.sessionKey, JSON.stringify(S)); }catch(e){} }
  function load(){
    try{ var s = sessionStorage.getItem(CFG.sessionKey); if(s){ S = JSON.parse(s);
      if(!S.pickLog) S.pickLog = [];
      if(!S.bonds) S.bonds = {};
      if(!S.bondNotes) S.bondNotes = [];
      if(S.iceUsed === undefined) S.iceUsed = false;
      if(!S.ads) S.ads = { reroll:0, consol:0, resup:0, evredo:0, befriend:0 };
      if(S.ads.befriend === undefined) S.ads.befriend = 0;
      if(!S.foeMarks) S.foeMarks = {};
      if(!S.befriended) S.befriended = {};
      if(S.actingX2 === undefined) S.actingX2 = false;
      if(S.evResult === undefined) S.evResult = null;
      return true; } }catch(e){}
    return false;
  }
  function drawOptions(){
    var usedSet = {};
    S.used.forEach(function(i){ usedSet[i] = 1; });
    var idx = new Set();
    while(idx.size < CFG.optionsPerRound){
      var i = Math.floor(rng()*PLAYERS.length);
      if(!usedSet[i]) idx.add(i);
    }
    S.options = Array.from(idx); S.sel = -1;
  }
  function topDims(p){
    if(p.name === MYSTERY) return p.rap.map(function(v,i){return [v,i];}).sort(function(a,b){return b[0]-a[0];}).slice(0,3)
      .map(function(x){ return DIMS[x[1]] + '??'; }).join(' · ');
    return p.rap.map(function(v,i){return [v,i];}).sort(function(a,b){return b[0]-a[0];}).slice(0,3)
      .map(function(x){ return DIMS[x[1]] + x[0]; }).join(' · ');
  }
  function rollMystery(){ return 40 + Math.floor(rng()*60); }
  function slotsHTML(){
    var h = '<div class="dims">';
    for(var i=0;i<12;i++){
      var f = S.attrs[i] !== null;
      h += '<div class="slot' + (f?' filled':'') + '"><div class="dn">' + DIMS[i] + '</div><div class="dv">' +
           (f ? S.attrs[i] : '—') + '</div><div class="ds">' + (f ? S.src[i] : '待夺') + '</div></div>';
    }
    return h + '</div>';
  }
  function header(){
    return '<div class="kicker">二 十 章 巡 演 · v3</div><h1>篮球有嘻哈</h1><div class="sub">从 116 位选手身上，夺走 12 项说唱本事<br>一路从天桥底下，唱到封神之夜</div>';
  }
  var AD_CAPS = { reroll: 3, consol: 2, resup: 2, evredo: 2, befriend: 2 };
  function showAd(cb){
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,14,8,.93);z-index:99;display:flex;align-items:center;justify-content:center';
    ov.innerHTML = '<div style="background:#f4ecd9;border-radius:14px;padding:26px 22px;width:82%;max-width:340px;text-align:center">'
      + '<div style="font-size:40px">📺</div><div style="font-weight:800;font-size:17px;margin:8px 0 4px">模拟广告</div>'
      + '<div style="font-size:12.5px;color:#6b5a43;line-height:1.7">小样里是占位演示，正式版接平台激励视频<br>看完才发奖励，中途退出不发</div>'
      + '<div style="height:8px;background:#e2d5b8;border-radius:4px;margin:16px 0 6px;overflow:hidden"><div id="ad-bar" style="height:100%;width:0%;background:#b03a2e;border-radius:4px;transition:width 1s linear"></div></div>'
      + '<div id="ad-sec" style="font-size:12px;color:#6b5a43">广告播放中 · 3 秒</div>'
      + '<button class="btn" id="ad-get" disabled style="opacity:.4;margin-top:12px">领取奖励</button>'
      + '<div><button class="btn ghost small" id="ad-x" style="margin-top:8px">放弃奖励离开</button></div></div>';
    document.body.appendChild(ov);
    var left = 3;
    var bar = ov.querySelector('#ad-bar'), sec = ov.querySelector('#ad-sec'), get = ov.querySelector('#ad-get');
    var timer = setInterval(function(){
      left--;
      bar.style.width = ((3 - left) / 3 * 100) + '%';
      if(left <= 0){ clearInterval(timer); sec.textContent = '广告播放完毕'; get.disabled = false; get.style.opacity = '1'; }
      else sec.textContent = '广告播放中 · ' + left + ' 秒';
    }, 1000);
    get.onclick = function(){ document.body.removeChild(ov); cb(); };
    ov.querySelector('#ad-x').onclick = function(){ clearInterval(timer); document.body.removeChild(ov); };
  }
  function render(){
    if(S.phase === 'intro'){ renderIntro(); }
    else if(S.phase === 'draft'){ renderDraft(); }
    else if(S.phase === 'chapter'){ renderChapter(); }
    else if(S.phase === 'battle'){ renderBattle(); }
    else if(S.phase === 'event'){ renderEvent(); }
    else if(S.phase === 'resupply'){ renderResupply(); }
    else if(S.phase === 'end'){ renderEnd(); }
    app.querySelectorAll('[data-befriend]').forEach(function(el){
      el.onclick = function(){ doBefriend(el.getAttribute('data-befriend')); };
    });
  }
  function renderIntro(){
    app.innerHTML = header() +
      '<img class="arcimg" src="art/arc1.jpg" alt="">' +
      '<div class="card"><b>怎么玩</b><br><span style="font-size:13px;line-height:1.8;color:#6b5a44">先用 12 轮选人，从球星和嘉宾身上夺走 12 项说唱能力（选过的人不会再出现）。然后开启 <b>20 章巡演</b>：每一章一个场子、一位对手，选对打法才能赢；章节之间有随机插曲找上门，中途还有 3 次补给换人的机会。<br>卡面颜色有讲究：金卡是传说，还有粉卡、绿卡和一张数值全是 ?? 的<b style="color:#1d8aa5">钻石卡</b>——夺走它的能力时，数值当场随机开出。<br>小提示：格局能到 <b style="color:#b3352c">100</b> 的只有库里和乔丹。看见他们，别手软。还有，阿耶莎藏着一项专属夺技「演技」——夺走它，后面每场战斗和每次插曲判定都有加成。<br>特定的两个人同一局都被你夺过，还会触发隐藏<b>「羁绊」</b>：有加成，也有坑，触发当场结算。<br>换一批、补给、判定重选这些机会，除了局内免费次数，还能看广告追加（小样里是模拟广告）。</span></div>' +
      '<button class="btn" id="b-start">开始拼人</button>' +
      '<div class="foot">内部试玩 · 二十章巡演版</div>';
    document.getElementById('b-start').onclick = function(){ S.phase='draft'; drawOptions(); save(); render(); };
  }
  function tierClass(p){
    if(p.name === MYSTERY) return 'diamond';
    if(p.name === '李小鹿') return 'pink';
    if(p.name === '库里') return 'green';
    if(p.name === '阿耶莎') return 'orange';
    if(p.tier === 'SSSSS') return 'gold king';
    if(p.tier === 'SSSS') return 'gold king';
    if(p.tier === 'SS' || p.tier === 'S') return 'gold';
    if(p.tier === 'A') return 'epic';
    if(p.tier === 'B') return 'rare';
    return '';
  }
  function tierBadge(p){
    if(p.name === MYSTERY) return '<span class="badge dia">💎钻石</span>';
    if(p.name === '阿耶莎') return '<span class="badge o">专属</span>';
    if(p.tier === 'SSSSS') return '<span class="badge g">SSSSS 👑👑</span>';
    if(p.tier === 'SSSS') return '<span class="badge g">SSSS 👑</span>';
    var c = tierClass(p);
    if(c === 'gold' || c === 'green') return '<span class="badge g">传说</span>';
    if(c === 'epic') return '<span class="badge e">史诗</span>';
    return '';
  }
  var QUIPS = { '库里':'他来了——头发是绿的，格局是满的（100）。', '斯蒂芬·库里':'新秀库里来了，娃娃脸一个，但那投篮的手稳得不像新人', '一只会唱跳rap的小鸡':'一只小鸡空降了，全场目光都被它和它的球吸走了', '马保国':'马老师来了！全场起立——他说要教对面做人', 'AI 本人':'它来了。它说它已经把你的韵脚全算完了', '刘大妈':'大妈带着她的音响来了，气势上已经赢了一半', '勒布朗·詹姆斯':'SSSS 驾到！全维 99.99——格局那格，你就当没看见', '迈克尔·乔丹':'SSSSS 驾到——两顶王冠，全维 100，这还比什么', 'PG ONE':'？？？候选里混进来一个真唱的', '阿耶莎':'？？？她怎么也来了（手里还拿着菜谱）——她还藏着一项专属能力：演技 99', '假乃亮':'郑重声明：这位是假的，和本人没关系', '李小鹿':'？？？候选里混进了一只鹿', '张驰':'💎 钻石卡！数值全是 ??，夺走哪项，当场随机开数' };
  function quipHTML(){
    var quip = null;
    S.options.forEach(function(pi){ var nm = PLAYERS[pi].name; if(!quip && QUIPS[nm]) quip = QUIPS[nm]; });
    return quip ? '<div class="hint">' + quip + '</div>' : '';
  }
  function detailHTML(mode){
    var p = PLAYERS[S.options[S.sel]];
    var isM = p.name === MYSTERY;
    var title = mode === 'resupply'
      ? p.name + tierBadge(p) + ' · 点一项能力换掉你现在的（本项已换过的不许再换）'
      : p.name + tierBadge(p) + ' · 点一项能力夺走（夺走后他不会再出现）' + (isM ? '<br><span style="color:#7fd4e8;font-size:12px">钻石卡：数值未知，点下去当场随机开出 40–99</span>' : '');
    var h = '<div class="detail"><div class="dt">' + title + '</div><div class="dims">';
    for(var i=0;i<12;i++){
      var off, label;
      if(mode === 'resupply'){ off = S.replaced.indexOf(i) >= 0; label = '现' + S.attrs[i]; }
      else { off = S.attrs[i] !== null; label = ''; }
      h += '<div class="chip' + (off?' off':'') + '" data-dim="' + i + '"><div class="cn">' + DIMS[i] + (label ? ' ' + label : '') + '</div><div class="cv">' + (isM ? '??' : p.rap[i]) + '</div></div>';
    }
    if(p.extra && !S.acting){
      h += '<div class="chip extra" data-extra="1"><div class="cn">专属夺技 · ' + p.extra.dim + '（不占夺技名额 · 夺走后：后续每场战斗 +3、插曲判定 +3）</div><div class="cv">' + p.extra.value + '</div></div>';
    }
    return h + '</div></div>';
  }
  function optionsHTML(){
    var h = '';
    S.options.forEach(function(pi, oi){
      var p = PLAYERS[pi];
      h += '<div class="pcard pop ' + tierClass(p) + (S.sel===oi?' sel':'') + '" data-pick="' + oi + '"><img src="portraits/' + p.portrait + '" alt=""><div><div class="pn">' + p.name + tierBadge(p) + '</div><div class="pt">' + p.note + '</div><div class="ptop">' + topDims(p) + '</div></div></div>';
    });
    return h;
  }
  function bindPicks(onDim){
    app.querySelectorAll('[data-pick]').forEach(function(el){
      el.onclick = function(){ S.sel = parseInt(el.getAttribute('data-pick'),10); save(); render(); };
    });
    app.querySelectorAll('[data-dim]').forEach(function(el){
      el.onclick = function(){ onDim(parseInt(el.getAttribute('data-dim'),10)); };
    });
  }
  function actBonus(){ return S.acting ? (S.actingX2 ? 6 : 3) : 0; }
  function actValue(){ return 99 + (S.bonds && S.bonds.model ? 3 : 0) + (S.bonds && S.bonds.side ? 3 : 0); }
  function actingHTML(){

    h += '<div class="card"><b>巡演战报</b><div style="margin-top:6px">';
    S.chapterLog.forEach(function(L){
      h += '<div class="logrow"><span>第' + L.n + '章 · ' + L.title + '</span><span class="' + (L.win?'win':'') + '">' + (L.win ? '胜' : '负') + '</span></div>';
    });
    h += '</div></div>';
    h += '<button class="btn" id="b-again">再来一轮巡演</button><div class="foot">截图这张结算，发回去说一句：好玩 / 一般 / 没意思</div>';
    app.innerHTML = h;
    document.getElementById('b-again').onclick = function(){ sessionStorage.removeItem(CFG.sessionKey); newGame(); };
  }
  if(!load() || !S){ newGame(); } else { render(); }
})();
</script>
</body>
</html>
