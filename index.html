<script>// 种子 RNG（mulberry32）；rngState 随档保存——注意：保存的是判定后的位置（母本同口径）
(function(){
  function hashSeed(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function createRng(seedStr, state){
    let a = (state!=null ? state>>>0 : hashSeed(String(seedStr)));
    const api = {
      next(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; },
      int(n){ return Math.floor(api.next()*n); },
      range(lo,hi){ return lo+api.int(hi-lo+1); },
      pick(arr){ return arr[api.int(arr.length)]; },
      shuffle(arr){ const r=arr.slice(); for(let i=r.length-1;i>0;i--){ const j=api.int(i+1); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; },
      state(){ return a>>>0; },
      setState(s){ a=s>>>0; }
    };
    return api;
  }
  function makeSeedCode(prefix, rng){ const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=prefix; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
  window.BK_RNG = { createRng, makeSeedCode, hashSeed };
})();
</script>
<script>// 公式层：只算不改状态（单一事实源）。传奇值公式逐字照设计案 §10，系数不许动。
(function(){
  const C = window.BK_CONFIG;
  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
  // 负荷冲突（母本德不配位）：能力超过 (体能+领袖)/2+30 的项数
  function loadConflict(attrs){
    const line = (attrs[9]+attrs[11])/C.LOAD_FORMULA_DIV + C.LOAD_FORMULA_ADD;
    let n=0; for(let i=0;i<12;i++){ if(i!==9 && i!==11 && attrs[i]>line) n++; }
    return n;
  }
  // 单项有效值：绝活 floor 保下限（锁定时记录 floors[attr]）
  function effAttr(state, idx){
    let v = state.attrs[idx];
    const f = state.attrFloors ? state.attrFloors[idx] : null;
    if(f!=null && v<f) v=f;
    return v;
  }
  // 判定成功率（母本）：clamp(35+(attr-60)*0.8 - 负荷*3 + 修正, 10, 90)；拼一把减半，上限95口径同母本锦囊位——本作无锦囊，封顶90
  function checkRate(state, idx, opts){
    opts = opts||{};
    let rate = C.CHECK_BASE + (effAttr(state, idx)-60)*C.CHECK_PER_POINT + loadConflict(state.attrs)*C.LOAD_RATE_PER;
    if(state.identity && C.IDENTITY_GROUPS[state.identity] && C.IDENTITY_GROUPS[state.identity].indexOf(idx)>=0) rate += C.IDENTITY_MOD;
    if(state.fateBuff && state.fateBuff>0) rate += C.FATE_BUFF;
    if(opts.mod) rate += opts.mod;
    rate = clamp(rate, C.CHECK_MIN, C.CHECK_MAX);
    if(opts.gamble) rate = Math.round(rate*C.GAMBLE_RATE_FACTOR);
    return rate;
  }
  function gradeOf(roll, rate, success){
    if(!success) return 'lose';
    if(roll <= rate - C.GRADE_GREAT_MARGIN) return 'great';
    return 'win';
  }
  function overall(state){
    const w = C.POS_WEIGHTS[state.position||'SF']; let s=0;
    for(let i=0;i<12;i++) s += state.attrs[i]*w[i];
    return Math.round(s*10)/10;
  }
  // 个人贡献副轴（§2：独立计量，不用传奇值冒充）
  function contribution(state){
    const r = state.resources;
    return r.merit*C.CONTRIBUTION.meritW + r.scene*C.CONTRIBUTION.sceneW + state.proSuccess*C.CONTRIBUTION.proW;
  }
  function contributionHigh(state){ return contribution(state) >= C.CONTRIBUTION.HIGH; }
  // 传奇值 = 500 + [ (功勋-18)*0.09 + (总评-72)*0.05 + clamp(高光*0.3,0,1.2) + clamp((人气+人脉)*0.04,-0.8,0.8) - clamp(争议*0.06,0,1.2) + 结局bonus ] * 45，封顶1000
  function legendValue(state, endingBonus){
    const r = state.resources;
    const inner = (r.merit-18)*0.09 + (overall(state)-72)*0.05
      + clamp(r.scene*0.3, 0, 1.2)
      + clamp((r.fame+r.rel)*0.04, -0.8, 0.8)
      - clamp(r.controversy*0.06, 0, 1.2)
      + (endingBonus||0);
    return Math.min(1000, Math.round(500 + inner*45));
  }
  window.BK_Formulas = { clamp, loadConflict, effAttr, checkRate, gradeOf, overall, contribution, contributionHigh, legendValue };
})();
</script>
<script>// 账本：资源变更唯一入口，带 reason 码留痕（防屎山纪律 §2.4）。其他模块不许直改 state.resources。
(function(){
  const FLOORS = { health:0, power:0, fame:0, rel:0, controversy:0, merit:0, scene:0 };
  const CAPS = { health:130 };
  function apply(state, changes, reason){
    const r = state.resources;
    state.ledgerLog = state.ledgerLog || [];
    const applied = {};
    for(const k in changes){
      if(!(k in r)) continue;
      let v = r[k] + changes[k];
      if(FLOORS[k]!=null) v = Math.max(FLOORS[k], v);
      if(CAPS[k]!=null) v = Math.min(CAPS[k], v);
      applied[k] = v - r[k]; r[k] = v;
    }
    state.ledgerLog.push({reason: reason||'unknown', changes: applied, at: state.battleIdx||0});
    if(state.ledgerLog.length>300) state.ledgerLog.splice(0, state.ledgerLog.length-300);
    return applied;
  }
  window.BK_Ledger = { apply };
})();
</script>
<script>// 存档层：唯一出入口。bk_save_v1；normalize 版本阶梯集中在此（防屎山纪律 §2.6）。
// 判定落盘：结算后立刻 save('*-settle') 并写 S.lastSettle，恢复时按 lastSettle.kind 重建结果页，不许重选重结算（2026-11-05 修复口径）。
(function(){
  const C = window.BK_CONFIG;
  function lsGet(k){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

  function defaultState(){
    return {
      ver: 1, phase: 'origin', // origin|position|draft|battle|event|settle|ending
      seed: '', rngState: null,
      originId: null, position: null, identity: null,
      attrs: new Array(12).fill(C.BASE_ATTR), attrSrc: new Array(12).fill(null), attrFloors: new Array(12).fill(null),
      lockedCount: 0, draftRound: 0, batch: null, batchTeam: null, swapsLeft: C.SWAPS_FREE,
      directedReady: false, fateBuff: 0, rewindArmed: false,
      resources: { health: C.START_HEALTH, power: 0, fame: 0, rel: 0, controversy: 0, merit: 0, scene: 0 },
      personalFail: 0, proSuccess: 0, selfStreak: 0, playoffRest: 0,
      flags: { loyal:false, transfer:false, injuryMark:false, bountyTag:false },
      battleIdx: 0, pendingEvent: null, lastSettle: null, eDoneBattle: [],
      ledgerLog: [], shopOwned: [], gambleNote: null, checkMod: null, finalsWins: 0,
      endingId: null, legend: null, submitted: false
    };
  }
  // 版本阶梯：只许在这里给老档补字段
  function normalize(s){
    if(!s || typeof s!=='object') return null;
    const d = defaultState();
    for(const k in d){ if(s[k]===undefined) s[k]=d[k]; }
    for(const k in d.resources){ if(s.resources[k]===undefined) s.resources[k]=d.resources[k]; }
    for(const k in d.flags){ if(s.flags[k]===undefined) s.flags[k]=d.flags[k]; }
    s.ver = 1;
    // phase 归一：settle 类 phase 恢复时统一回到 battle 流（靠 lastSettle 分发重建）——母本 settle 修复实锤口径
    if(s.phase==='chapter-settle' || s.phase==='event-settle') s.phase='battle';
    return s;
  }
  let current = null;
  const Save = {
    load(){ const s = normalize(lsGet(C.SAVE_KEY)); current = s; return s; },
    peek(){ return current; },
    startNew(state){ current = state; Save.save('new-game'); return current; },
    save(reason){ if(current) lsSet(C.SAVE_KEY, current); },
    clear(){ current=null; lsDel(C.SAVE_KEY); },
    adopt(state){ current = normalize(state); return current; }
  };
  const Meta = {
    load(){ return lsGet(C.META_KEY) || { points:0, shopOwned:[], runs:0, endingsSeen:[], lbName:'' }; },
    save(m){ lsSet(C.META_KEY, m); }
  };
  window.BK_Save = Save; window.BK_Meta = Meta; window.BK_defaultState = defaultState; window.BK_normalizeSave = normalize;
  window.BK_ls = { get: lsGet, set: lsSet, del: lsDel };
})();
</script>
<script>// 广告层：PENDING v5.22 口径（拼将三作现行版，本作出生即带齐）
// - settlePendingAd() 是唯一核对入口；只认平台广告计数余额增量发奖，落定即删标记
// - 未落定保留续核；TTL 12h 先核对后清理留痕；PENDING 带 token 防覆盖
// - 死锁改造：未落定只短暂拦截（年龄<=3分钟 且 核对次数<=2），超时必放行
// - 存储：主槽 bk_pending_ad（单条）+ 后台槽队列 bk_pending_queue（上限5）FIFO 逐条核对；落定须 count>max(base,floor)，落定后 floor+1
(function(){
  const C = window.BK_CONFIG;
  const LS = window.BK_ls;
  // vatask 探活：getActivityTaskState 与 completeRewardVideo 均为 function 才算可用
  function vatask(){
    const v = window.ColorboxAI && window.ColorboxAI.vatask;
    return !!(v && typeof v.getActivityTaskState==='function' && typeof v.completeRewardVideo==='function');
  }
  let platCache = null; // 平台广告计数内存缓存（vatask 可用时）
  function adCount(){
    if(vatask()){
      if(typeof platCache==='number') return platCache;
      const v = LS.get(C.PLAT_ADCOUNT_KEY);
      if(typeof v==='number'){ platCache = v; return v; }
      return 0;
    }
    return LS.get(C.MOCK_ADCOUNT_KEY) || 0; // mock 平台计数
  }
  // 刷新平台计数：code===200 且 availableChanceCount 为 number 时更新缓存并落盘；失败静默
  async function refreshCount(){
    if(!vatask()) return adCount();
    try{
      const st = await window.ColorboxAI.vatask.getActivityTaskState();
      if(st && st.code===200 && st.data && typeof st.data.availableChanceCount==='number'){
        platCache = st.data.availableChanceCount;
        LS.set(C.PLAT_ADCOUNT_KEY, platCache);
      }
    }catch(e){}
    return adCount();
  }
  function hasPendingToken(token){
    const m = getMain(); if(m && m.token===token) return true;
    return getQueue().some(r=>r && r.token===token);
  }
  function removePendingByToken(token){
    const m = getMain();
    if(m && m.token===token){ setMain(null); return true; }
    const q = getQueue(); const i = q.findIndex(r=>r && r.token===token);
    if(i>=0){ q.splice(i,1); setQueue(q); return true; }
    return false;
  }
  function floor_(){ return LS.get(C.AD_FLOOR_KEY) || 0; }
  function getMain(){ return LS.get(C.PENDING_KEY); }
  function getQueue(){ return LS.get(C.PENDING_QUEUE_KEY) || []; }
  function setMain(p){ if(p) LS.set(C.PENDING_KEY, p); else LS.del(C.PENDING_KEY); }
  function setQueue(q){ LS.set(C.PENDING_QUEUE_KEY, q); }
  function isBlocking(p, now){
    if(!p) return false;
    return (now - p.t) <= C.AD_BLOCK_AGE_MS && (p.checks||0) <= C.AD_BLOCK_MAX_CHECKS;
  }
  // 模拟平台：完播后计数 +1（真机为平台记账，客户端只读差量）
  function mockComplete(){ LS.set(C.MOCK_ADCOUNT_KEY, adCount()+1); }
  // 平台路径（vatask 可用时）：拦截/挤队列前置判断与 mock 路径相同；基线取平台计数，完播只认平台回执/差量
  async function watchPlatform(type, grantFn){
    const now = Date.now();
    const main = getMain();
    if(main && main.type!==type && isBlocking(main, now)){
      Ads.settleAll(grantFn);
      if(getMain()) return { ok:false, reason:'checking' };
    }
    if(main && main.type!==type){
      // 主槽被他类占用且已可放行：挤入后台队列续核
      const q = getQueue(); if(q.length < C.AD_QUEUE_MAX){ q.push(main); setQueue(q); } setMain(null);
    }
    await refreshCount();
    const base = adCount();
    const token = 'ad_' + now.toString(36) + '_' + Math.floor(Math.random()*1e6).toString(36);
    const rec = { type, token, base, t: now, checks: 0 };
    setMain(rec);
    let receipt = 'none'; // ok＝明确获奖回执；denied＝平台明确不可用；none＝其余/抛错，无明确回执
    try{
      const res = await window.ColorboxAI.vatask.completeRewardVideo();
      if(res && res.data && res.data.rewarded===true) receipt = 'ok';
      else if(res && res.data && res.data.reason==='UNAVAILABLE') receipt = 'denied';
    }catch(e){ receipt = 'none'; }
    if(receipt==='denied'){
      removePendingByToken(token); // 按 token 精确删本条，不动其他 PENDING
      return { ok:false, reason:'unavailable', token };
    }
    if(receipt!=='ok'){
      return { ok:false, reason:'unsettled', token }; // 保留 PENDING 交差量续核
    }
    await refreshCount();
    let settledList = Ads.settleAll(grantFn);
    if(hasPendingToken(token)){
      // 计数刷新滞后、本条仍未落定：按母本回执口径把平台计数视为 base+1 再核对一次
      platCache = base+1;
      LS.set(C.PLAT_ADCOUNT_KEY, platCache);
      const more = Ads.settleAll(grantFn);
      settledList = settledList.concat(more.filter(t=>settledList.indexOf(t)<0));
    }
    return { ok:true, settled: settledList.indexOf(type)>=0, token };
  }
  const Ads = {
    count: adCount,
    refreshCount,
    platform(){ return vatask(); },
    // 发起观看：vatask 可用走平台路径（async）；不可用走 mock 同步逻辑（已有未落定主槽且仍在拦截窗内 -> 拒绝防覆盖；否则写 PENDING 并模拟完播）
    watch(type, grantFn){
      if(vatask()) return watchPlatform(type, grantFn);
      const now = Date.now();
      const main = getMain();
      if(main && main.type!==type && isBlocking(main, now)){
        Ads.settleAll(grantFn);
        if(getMain()) return { ok:false, reason:'checking' };
      }
      if(main && main.type!==type){
        // 主槽被他类占用且已可放行：挤入后台队列续核
        const q = getQueue(); if(q.length < C.AD_QUEUE_MAX){ q.push(main); setQueue(q); } setMain(null);
      }
      const token = 'ad_' + now.toString(36) + '_' + Math.floor(Math.random()*1e6).toString(36);
      const rec = { type, token, base: adCount(), t: now, checks: 0 };
      setMain(rec);
      mockComplete(); // 本地 mock 即时完播；真机此处拉起平台广告
      const settled = Ads.settleAll(grantFn);
      return { ok:true, settled: settled.indexOf(type)>=0, token };
    },
    // 唯一核对入口：主槽+队列 FIFO 逐条；返回本次落定的 type 列表
    settleAll(grantFn){
      const now = Date.now(); const settled = [];
      const tryRec = (rec)=>{
        if(!rec) return false;
        rec.checks = (rec.checks||0)+1;
        const cnt = adCount(); const fl = floor_();
        if(cnt > Math.max(rec.base, fl)){
          LS.set(C.AD_FLOOR_KEY, cnt); // 落定后水位推进（floor 以实际计数为准，防同一增量被旧账误领）
          if(grantFn) grantFn(rec.type, rec);
          settled.push(rec.type);
          return true;
        }
        // 未落定：TTL 过期先留痕再清（本次已核对过）
        if(now - rec.t > C.AD_TTL_MS){ settled.push('expired:'+rec.type); return true; }
        return false;
      };
      let main = getMain();
      if(main){ if(tryRec(main)) setMain(null); else setMain(main); }
      const q = getQueue(); const rest = [];
      for(const rec of q){ if(!tryRec(rec)) rest.push(rec); }
      setQueue(rest);
      return settled;
    },
    blocking(now){ return isBlocking(getMain(), now||Date.now()); },
    pending(){ return { main: getMain(), queue: getQueue() }; },
    _test: { setMain, setQueue, getMain, getQueue, mockComplete, isBlocking }
  };
  window.BK_Ads = Ads;
})();
</script>
<script>// 榜单客户端：bk_ 前缀；总榜/最水榜/每日双榜（每日榜按北京时间日期）。
// 真路径走母本 LB 层：cloud.auth + cloud.request（直连网络请求拿不到登录凭据）；
// 无 ColorboxAI 时静默回落本地 mock，条目与返回形状与生产完全一致（{entries,total}）。
(function(){
  const C = window.BK_CONFIG;
  const LS = window.BK_ls;
  const LB_API_BASE = C.LB_API_BASE;
  const LB_ENV_ID = C.LB_ENV_ID;
  // 每日榜日期：北京时间（Date.now()+8h 后取 UTC 年月日拼 YYYYMMDD，母本口径）
  function todayStr(){
    const d = new Date(Date.now() + 8*3600*1000);
    const p = n=>String(n).padStart(2,'0');
    return ''+d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate());
  }
  function boards(){
    const t = todayStr();
    return {
      best: C.BOARD_PREFIX+'best_s1',
      worst: C.BOARD_PREFIX+'worst',
      dbest: C.BOARD_PREFIX+'dbest_'+t,
      dworst: C.BOARD_PREFIX+'dworst_'+t
    };
  }
  // —— 母本 LB 层 ——
  function available(){
    const cb = window.ColorboxAI;
    return !!(cb && cb.cloud && typeof cb.cloud.request==='function' && typeof cb.cloud.auth==='function');
  }
  let __lbAuthed = false;
  async function auth(){
    if(__lbAuthed) return;
    const r = await window.ColorboxAI.cloud.auth({ envId: LB_ENV_ID });
    if(!r || (r.code!==200 && r.code!==0)) throw new Error('请先登录');
    __lbAuthed = true;
  }
  async function request(path, data){
    await auth();
    const resp = await window.ColorboxAI.cloud.request({ url: LB_API_BASE+path, method: data?'POST':'GET', data, envId: LB_ENV_ID, auth: true });
    if(!resp || resp.statusCode===401) throw new Error('请先登录');
    if(resp.statusCode!==200 || (resp.code!==0 && resp.code!==200)) throw new Error((resp && resp.message) || '榜单服务异常');
    return resp.data;
  }
  let __lbProfile = null;
  async function profile(){
    if(__lbProfile) return __lbProfile;
    try{
      const cb = window.ColorboxAI;
      if(cb && cb.auth && typeof cb.auth.getUserInfo==='function'){
        const r = await cb.auth.getUserInfo();
        if(r && r.code===200 && r.data){
          const av = r.data.avatar || r.data.userHeadUrl;
          __lbProfile = { nickname: r.data.nickname ? String(r.data.nickname).slice(0,40) : '虎扑用户', avatar: (typeof av==='string' && /^https?:\/\//.test(av) && av.length<=512) ? av : null };
          return __lbProfile;
        }
      }
    }catch(e){}
    return { nickname: '虎扑用户', avatar: null };
  }
  // —— 本地 mock 回落（形状与生产一致） ——
  function mockStore(){ return LS.get(C.MOCK_LB_KEY) || {}; }
  function mockSaveBoard(board, entry){
    const store = mockStore(); const list = store[board]||[];
    list.push(entry);
    // best/dbest：score 降序，同分早者胜；worst/dworst：deathCh 升序 -> score 升序 -> 时间
    const isWorst = board.indexOf('worst')>=0;
    list.sort((a,b)=> isWorst ? ((a.deathCh||0)-(b.deathCh||0) || a.score-b.score || a.ts-b.ts) : (b.score-a.score || a.ts-b.ts));
    store[board] = list.slice(0, 200);
    LS.set(C.MOCK_LB_KEY, store);
    return { entries: store[board].slice(0, C.LB_PAGE), total: store[board].length };
  }
  function mockFetch(board){
    const store = mockStore(); const list = store[board]||[];
    return { entries: list.slice(0, C.LB_PAGE), total: list.length };
  }
  async function submitBoard(board, payload){
    const p = await profile();
    if(!available()){
      const entry = { displayName: p.nickname, score: payload.score, deathCh: payload.deathCh!=null?payload.deathCh:null, ending: payload.ending||'', ts: Date.now() };
      return mockSaveBoard(board, entry);
    }
    return request('/leaderboard/submit', Object.assign({ board, displayName: p.nickname, avatar: p.avatar || undefined }, payload));
  }
  const LB = {
    boards, todayStr,
    available, auth, request, profile, submitBoard,
    async submitResult(result){
      const score = result.score, ending = result.ending;
      const b = boards(); const out = {};
      out[b.best] = await submitBoard(b.best, { score, ending });
      out[b.dbest] = await submitBoard(b.dbest, { score, ending });
      // 后端 worst 榜要求 deathCh 整数 1..19：止步第 20 战（亚军/冠军，exitBattle=20）不进最水榜
      if(!result.champion && result.exitBattle<=19){
        const deathCh = Math.min(19, Math.max(1, result.exitBattle));
        out[b.worst] = await submitBoard(b.worst, { score, deathCh, ending });
        out[b.dworst] = await submitBoard(b.dworst, { score, deathCh, ending });
      }
      return out;
    },
    async load(board){
      if(!available()) return mockFetch(board);
      try{
        return await request('/leaderboard?board='+encodeURIComponent(board));
      }catch(e){
        return { entries: [], total: 0 };
      }
    },
    _test: { mockSaveBoard, mockFetch }
  };
  window.BK_LB = LB;
})();
</script>

<script>// 流程层：状态机核心（与 DOM 解耦，Node 可直接驱动跑 full_run/蒙特卡洛）。
// 状态变更纪律：资源只走 Ledger，判定只走 Formulas，存档只走 Save。
(function(){
  const C = window.BK_CONFIG, F = window.BK_Formulas, L = window.BK_Ledger;
  const D = window.BK_DATA;
  let rng = null;
  function ensureRng(state){
    if(!rng) rng = window.BK_RNG.createRng(state.seed, state.rngState);
    return rng;
  }
  function syncRng(state){ if(rng) state.rngState = rng.state(); }
  function playerByName(name){ return D.players.find(p=>p.name===name); }

  function newGame(opts){
    opts = opts||{};
    const seed = opts.seed || window.BK_RNG.makeSeedCode(C.SEED_PREFIX);
    rng = window.BK_RNG.createRng(seed);
    const s = window.BK_defaultState();
    s.seed = seed;
    const origin = C.ORIGINS.find(o=>o.id===opts.originId) || C.ORIGINS[1];
    s.originId = origin.id; s.position = opts.positionId || 'SF';
    // meta 商店生效（开局类）
    const meta = window.BK_Meta.load(); s.shopOwned = meta.shopOwned||[];
    let startHealth = C.START_HEALTH, extraSwap = 0;
    for(const id of s.shopOwned){ const item = C.SHOP.find(x=>x.id===id); if(!item) continue;
      if(item.effect.startHealth) startHealth += item.effect.startHealth;
      if(item.effect.extraSwap) extraSwap += item.effect.extraSwap;
    }
    s.resources.health = startHealth;
    s.resources.power = origin.power; s.resources.fame = origin.fame; s.resources.rel = origin.rel;
    for(const id of s.shopOwned){ const item = C.SHOP.find(x=>x.id===id); if(!item) continue;
      if(item.effect.startRel) s.resources.rel += item.effect.startRel;
      if(item.effect.startFame) s.resources.fame += item.effect.startFame;
      if(item.effect.startControversy) s.resources.controversy = Math.max(0, s.resources.controversy + item.effect.startControversy);
    }
    s.swapsLeft = C.SWAPS_FREE + extraSwap;
    s.phase = 'draft';
    genBatch(s);
    syncRng(s);
    return s;
  }

  // —— 选秀 ——
  function teamForRound(s){
    // 12 轮：六队各两轮，种子序
    const order = rng.shuffle(C.TEAMS.slice());
    return order[s.draftRound % order.length];
  }
  function genBatch(s, forcedTeam){
    const team = forcedTeam || teamForRound(s);
    const pool = D.players.filter(p=>p.team===team && !s.attrSrc.includes(p.name));
    const picks = rng.shuffle(pool).slice(0, C.BATCH_SIZE);
    const batch = picks.map(p=>({ name:p.name, peak:false }));
    // 巅峰赛季卡：该队有巅峰卡且本体未被锁源时，按概率替换一席
    const peaks = D.peaks.filter(pk=>{ const base = playerByName(pk.base); return base && base.team===team && !s.attrSrc.includes(pk.base); });
    if(peaks.length && rng.next() < C.PEAK_CHANCE){
      const pk = peaks[rng.int(peaks.length)];
      const slot = rng.int(batch.length);
      batch[slot] = { name: pk.base, peak:true, peakYear: pk.year, label: pk.label };
    }
    s.batch = batch; s.batchTeam = team;
    return batch;
  }
  function candidateObj(entry){
    const base = playerByName(entry.name);
    if(!entry.peak) return base;
    const stats = base.stats.slice();
    const order = stats.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,3);
    for(const [,i] of order) stats[i] = Math.min(99, stats[i]+C.PEAK_BOOST);
    const special = { attr: base.special.attr, kind: base.special.kind, value: base.special.kind==='floor' ? Math.min(99, base.special.value+3) : base.special.value+2 };
    return Object.assign({}, base, { stats, special, isPeak:true, peakLabel: entry.label });
  }
  function draftPick(s, batchIdx, attrIdx){
    const entry = s.batch[batchIdx]; if(!entry) return { ok:false, reason:'no-batch' };
    const cand = candidateObj(entry);
    let val = cand.stats[attrIdx];
    // 商店：投篮训练师——投篮三维（三分/中投/突破位中的射术维 0/1）下限
    const shootItem = s.shopOwned.includes('trainer');
    if(shootItem && (attrIdx===0||attrIdx===1)) val = Math.max(val, 0) // 占位：下限在锁定时以 floor 形式体现
    s.attrs[attrIdx] = cand.stats[attrIdx];
    s.attrSrc[attrIdx] = cand.name;
    if(cand.special && cand.special.attr===attrIdx){
      if(cand.special.kind==='floor') s.attrFloors[attrIdx] = cand.special.value;
      else s.attrs[attrIdx] = Math.min(99, s.attrs[attrIdx] + cand.special.value);
    }
    if(shootItem && (attrIdx===0||attrIdx===1)) s.attrFloors[attrIdx] = Math.max(s.attrFloors[attrIdx]||0, cand.stats[attrIdx]-0);
    s.lockedCount++; s.draftRound++;
    s.batch = null;
    if(s.draftRound >= C.DRAFT_ROUNDS){ s.phase='battle'; s.battleIdx=1; }
    else genBatch(s);
    syncRng(s);
    return { ok:true, done: s.phase==='battle' };
  }
  function rerollBatch(s){
    if(s.swapsLeft<=0) return { ok:false, reason:'no-swaps' };
    s.swapsLeft--; genBatch(s); syncRng(s); return { ok:true };
  }
  function directedDraft(s, team){
    if(!s.directedReady) return { ok:false, reason:'not-ready' };
    s.directedReady = false; genBatch(s, team); syncRng(s); return { ok:true };
  }

  // —— 战斗判定 ——
  function battleDef(s){ return window.BK_BATTLES[s.battleIdx-1]; }
  function preBattle(s){
    // 负荷冲突：每场首扣（在 choose 时结算一次，记录于 lastSettle.pre）
    const lc = F.loadConflict(s.attrs);
    return lc;
  }
  function scaleFx(fx, mult){
    if(!fx) return {}; const out={}; for(const k in fx) out[k]=fx[k]*mult; return out;
  }
  function chooseBattle(s, key, opts){
    opts = opts||{}; const gamble = !!opts.gamble;
    const b = battleDef(s); if(!b) return { ok:false, reason:'no-battle' };
    const opt = b[key]; if(!opt) return { ok:false, reason:'no-option' };
    const rec = { kind:'battle', battle:b.id, key, gamble, pre:null, lines:[] };
    // 负荷冲突场首结算
    const lc = preBattle(s);
    if(lc>0){ L.apply(s, { health: lc*C.LOAD_HEALTH_PER }, 'load-conflict'); rec.pre = { load: lc, health: lc*C.LOAD_HEALTH_PER }; }
    let grade = 'fixed', success = null, roll = null, rate = null;
    if(opt.kind==='identity'){
      s.identity = opt.identity; grade='fixed';
      L.apply(s, opt.fixed||{}, 'identity');
    } else if(opt.kind==='finals'){
      const fin = resolveFinals(s, opt.finals);
      grade = fin.win ? 'win' : 'lose'; success = fin.win; rec.finals = fin;
      if(fin.win){ L.apply(s, { merit: 0 }, 'finals'); }
    } else if(opt.kind==='fixed'){
      L.apply(s, opt.fixed||{}, 'battle-fixed');
      if(opt.flag==='loyal'){ s.flags.loyal = true; }
      if(opt.flag==='transfer'){ s.flags.transfer = true; }
      if(opt.flag==='injuryMark'){ s.flags.injuryMark = true; }
      if(opt.playoffRest){ s.playoffRest++; }
    } else {
      // 判定类
      const mods = {};
      if(s.checkMod && s.checkMod.battles>0) mods.mod = s.checkMod.value;
      rate = F.checkRate(s, opt.attr, Object.assign({}, mods, { gamble }));
      roll = Math.floor(rng.next()*100)+1;
      success = roll <= rate;
      grade = success ? F.gradeOf(roll, rate, true) : (opt.kind==='plan' && roll <= rate + C.GRADE_HOLD_MARGIN ? 'hold' : 'lose');
      const mult = gamble ? 2 : 1;
      if(success){
        L.apply(s, scaleFx(opt.win, mult), 'battle-win');
        let merit = C.MERIT[grade]*mult;
        if(opt.noMerit) merit = 0;
        L.apply(s, { merit }, 'battle-merit');
        if(opt.kind==='pro'){
          s.proSuccess++;
          if(F.effAttr(s, opt.attr) >= C.SCENE_ATTR_MIN && rng.next()<0.9){ L.apply(s, { scene: 1 }, 'scene'); rec.scene = true; }
        }
      } else {
        L.apply(s, scaleFx(opt.lose, mult), 'battle-lose');
        if(gamble) L.apply(s, C.GAMBLE_FAIL_EXTRA, 'gamble-extra');
        if(opt.kind==='plan' && grade==='hold'){ if(!opt.noMerit) L.apply(s, { merit: C.MERIT.hold*mult }, 'battle-merit'); }
        if(opt.kind==='pro'){ s.personalFail++; }
        if(opt.flag==='injuryMark'){ s.flags.injuryMark = true; }
      }
      rec.rate = rate; rec.roll = roll;
    }
    rec.grade = grade; rec.success = success;
    if(s.checkMod && s.checkMod.battles>0){ s.checkMod.battles--; if(s.checkMod.battles<=0) s.checkMod=null; }
    if(s.fateBuff>0) s.fateBuff--;
    s.selfStreak = (opt.kind==='fixed') ? s.selfStreak+1 : 0;
    if(s.selfStreak >= C.SELF_PENALTY_FROM){
      L.apply(s, C.SELF_PENALTY, 'self-penalty');
      if(s.selfStreak > C.SELF_PENALTY_FROM) L.apply(s, C.SELF_PENALTY_ESCALATE, 'self-penalty-esc');
      rec.selfPenalty = true;
    }
    s.lastSettle = rec; s.phase='battle';
    syncRng(s);
    // 结算后推进（落盘由 UI 层在 choose 后立刻 Save.save('battle-settle')）
    advanceAfterBattle(s, rec);
    return { ok:true, rec };
  }
  function resolveFinals(s, path){
    const r = s.resources;
    // 终局门槛（校准定版）：须过判定且战力达标；亲为成功积累给判定加成（关键回合经验），无亲为积累的躺平构筑在此被拦
    const proMod = Math.min(8, s.proSuccess*2);
    if(path==='A'){
      const best = Math.max(F.effAttr(s,1), F.effAttr(s,2), F.effAttr(s,0));
      const rate = F.checkRate(s, best===F.effAttr(s,1)?1:(best===F.effAttr(s,2)?2:0), { mod: proMod });
      const roll = Math.floor(rng.next()*100)+1;
      return { win: roll<=rate && r.power>=C.FINALS.A_POWER, path, rate, roll, needPower: C.FINALS.A_POWER };
    }
    if(path==='B'){
      const rate = Math.round((F.checkRate(s,4,{}) + F.checkRate(s,10,{}))/2) + proMod;
      const roll = Math.floor(rng.next()*100)+1;
      return { win: roll<=rate && r.power>=C.FINALS.B_POWER, path, rate, roll, needPower: C.FINALS.B_POWER };
    }
    // C 教练布置：固定结算，靠资源门槛
    return { win: r.power>=C.FINALS.C_POWER && r.merit>=C.FINALS.C_MERIT, path, rate:null, roll:null, needPower: C.FINALS.C_POWER, needMerit: C.FINALS.C_MERIT };
  }
  function advanceAfterBattle(s, rec){
    const b = battleDef(s);
    // 伤退即时判定
    if(s.resources.health<=0){ finishRun(s, 'injury'); return; }
    // 季后赛淘汰
    if(b.knockout && rec.success===false){ finishRun(s, knockoutEnding(b.knockout, s)); return; }
    if(b.special==='gate' && s.battleIdx===14){
      if(s.resources.merit < C.PLAYOFF_GATE_MERIT){ finishRun(s, 'regular_out'); return; }
    }
    if(b.id===20){ finishRun(s, championOrRunnerUp(s, rec)); return; }
    // 拼至报销判定点：第19战末
    if(b.id===C.PERSONAL_FAIL_CHECK_BATTLE){
      if(s.personalFail>=C.PERSONAL_FAIL_END || (s.personalFail>=C.PERSONAL_FAIL_END_LOWHP && s.resources.health<C.PERSONAL_FAIL_HP_LINE)){ finishRun(s, 'exhausted'); return; }
    }
    // 休整点
    if(C.REST_AFTER.includes(b.id)){ L.apply(s, { health: C.REST_HEALTH }, 'rest'); rec.rest = C.REST_HEALTH; }
    // 事件点
    if(C.EVENT_AFTER.includes(b.id) && !s.eDoneBattle.includes(b.id)){
      const ev = drawEvent(s);
      if(ev){ s.pendingEvent = ev.id; s.phase='event'; return; }
    }
    s.battleIdx++;
  }
  function knockoutEnding(kind, s){
    if(kind==='round1') return F.contributionHigh(s) ? 'rookie_wall' : 'first_round';
    if(kind==='round2') return s.flags.transfer ? 'wandering' : (F.contributionHigh(s) ? 'second_ceiling' : 'second_out');
    if(kind==='confFinal') return (s.flags.loyal && !s.flags.transfer) ? 'one_team' : (F.contributionHigh(s) ? 'one_step' : 'gate_fall');
    return 'first_round';
  }
  function championOrRunnerUp(s, rec){
    if(rec.finals && rec.finals.win){
      if(s.playoffRest>=C.LYING_CHAMP_REST_MIN && s.resources.merit<=C.LYING_CHAMP_MERIT_MAX) return 'lying_champ';
      return F.contributionHigh(s) ? 'champion_top' : 'champion_piece';
    }
    // 亚军
    if(s.flags.loyal && !s.flags.transfer) return 'one_team';
    return F.contributionHigh(s) ? 'uncrowned' : 'game7_loss';
  }
  function drawEvent(s){
    const pool = window.BK_EVENTS.filter(ev=>{
      if(ev.cond==='transferOrRumor' && !(s.flags.transfer || s.resources.controversy>=2)) return false;
      return true;
    });
    const ev = pool[rng.int(pool.length)];
    return ev;
  }
  function chooseEvent(s, key){
    const ev = window.BK_EVENTS.find(e=>e.id===s.pendingEvent);
    if(!ev) { s.pendingEvent=null; s.phase='battle'; s.battleIdx++; return { ok:false, reason:'no-event' }; }
    const opt = ev[key]; const rec = { kind:'event', event: ev.id, key, lines:[] };
    if(opt.train){ const idx = rng.int(12); s.attrs[idx]=Math.min(99, s.attrs[idx]+1); rec.trainAttr = idx; }
    if(opt.attr!=null || opt.kind==='pro'){
      let attr = opt.attr;
      if(attr==='best'){ let bi=0; for(let i=0;i<12;i++) if(F.effAttr(s,i)>F.effAttr(s,bi)) bi=i; attr=bi; }
      const rate = F.checkRate(s, attr, {}); const roll = Math.floor(rng.next()*100)+1;
      rec.rate=rate; rec.roll=roll; rec.success = roll<=rate;
      L.apply(s, rec.success? (opt.win||{}) : (opt.lose||{}), 'event');
    } else {
      L.apply(s, opt.fixed||{}, 'event-fixed');
    }
    if(opt.buff){ s.checkMod = { value: opt.buff.mod, battles: opt.buff.battles }; }
    if(opt.debuff){ s.checkMod = { value: opt.debuff.mod, battles: opt.debuff.battles }; }
    if(opt.flag==='injuryMark') s.flags.injuryMark = true;
    if(opt.restPlus && s.battleIdx>=15) s.playoffRest++;
    s.eDoneBattle.push(s.battleIdx);
    s.lastSettle = rec; s.pendingEvent = null; s.phase='battle';
    s.battleIdx++;
    syncRng(s);
    if(s.resources.health<=0) finishRun(s, 'injury');
    return { ok:true, rec };
  }
  // —— 结局 ——（§8 优先级顺序在 ENDINGS 表内以 priority 字段固化，此处按触发直达，顺序即代码顺序）
  function finishRun(s, endingId){
    s.phase='ending'; s.endingId = endingId;
    const def = D.endings.find(e=>e.id===endingId);
    const legend = F.legendValue(s, def?def.bonus:0);
    s.legend = legend;
    // 抱团标签
    const sCount = s.attrSrc.filter(n=>{ const p=playerByName(n); return p && p.tier==='S'; }).length;
    s.flags.bountyTag = sCount >= C.BOUNTY_CONCENTRATION_S_COUNT;
    // meta 结算：生涯功勋点 = 本局功勋
    const meta = window.BK_Meta.load();
    meta.points += s.resources.merit; meta.runs += 1;
    if(!meta.endingsSeen.includes(endingId)) meta.endingsSeen.push(endingId);
    window.BK_Meta.save(meta);
    return def;
  }
  // —— 广告 grant 分发 ——
  function applyAdGrant(s, type){
    if(type==='directed'){ s.directedReady = true; }
    else if(type==='fate'){ s.fateBuff = C.FATE_BATTLES; }
    else if(type==='heal'){ L.apply(s, { health: C.HEAL_AD_AMOUNT }, 'ad-heal'); }
    else if(type==='extraSwap'){ s.swapsLeft += 1; }
    else if(type==='rewind'){ s.rewindArmed = true; }
  }
  function useRewind(s){
    if(!s.rewindArmed || !s.lastSettle || s.lastSettle.kind!=='battle') return { ok:false };
    // 改命：回滚上一战的资源变动不可行（账本只进不退），采用母本外口径——清除上一战的个人失败计数并回健康8，标记本战重打
    s.rewindArmed = false;
    if(s.lastSettle.success===false) s.personalFail = Math.max(0, s.personalFail-1);
    L.apply(s, { health: 8 }, 'rewind');
    s.phase='battle';
    return { ok:true };
  }
  window.BK_Game = { newGame, genBatch, candidateObj, draftPick, rerollBatch, directedDraft, chooseBattle, chooseEvent, applyAdGrant, useRewind, finishRun, playerByName, battleDef, ensureRng, syncRng };
})();
</script>
<script>// 视图层：球探报告风。所有按钮显式设文字颜色（CSS .btn 已定色）；中文全为真实 HTML 文字。
(function(){

  function saveNow(r){ Save.save(r||'ui'); }
  function resBar(){

  }
  function slotsHtml(){
    let h = '<div class="slots">';
    for(let i=0;i<12;i++){
      const filled = S && S.attrSrc[i];
      h += '<div class="slot'+(filled?' filled':'')+'"><div>'+C.ATTRS[i]+'</div><div class="v">'+(filled?S.attrs[i]:'—')+'</div><div class="src">'+(filled?esc(S.attrSrc[i]):'待选秀')+'</div></div>';
    }

  }
  function timelineHtml(){
    let h = '<div class="timeline">';
    window.BK_BATTLES.forEach((b,i)=>{
      const cls = S && S.phase!=='draft' ? (i+1 < S.battleIdx ? 'done' : (i+1===S.battleIdx?'now':'')) : '';
      h += '<span class="'+cls+'">'+b.id+' '+esc(b.name)+'</span>';

  function modal(html){ document.getElementById('modal-root').innerHTML = '<div class="modal"><div class="box">'+html+'</div></div>'; }
  function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
  window.BK_UI = { render, setState:(s)=>{S=s;} };
  function render(){
    if(view==='home') return renderHome();
    if(view==='setup') return renderSetup();
    if(view==='draft') return renderDraft();
    if(view==='battle') return renderBattle();
    if(view==='event') return renderEvent();
    if(view==='ending') return renderEnding();
    if(view==='gallery') return renderGallery();
    if(view==='boards') return renderBoards();
    if(view==='shop') return renderShop();
    renderHome();
  }
  // —— 首页（选秀台：12 空槽 + 赛季时间轴先行）——
  function renderHome(){
    const has = !!Save.peek();
    app.innerHTML =
    '<div style="padding:16px 10px 4px"><div class="kicker">球探报告 · SCOUTING REPORT</div><h1 class="title">巨星拼图：巅峰王朝</h1><div class="sub" style="margin-left:0">12 轮选秀夺技，一局拼出历史第一人</div></div>'
    + '<div class="paper"><h3>我的拼图（12 项能力）</h3>'+slotsHtml()+'<h3>赛季时间轴（20 个关键战役）</h3>'+timelineHtml()+'</div>'
    + '<div style="margin:0 10px">'
    + (has ? '<button class="btn primary" id="b-continue">继续赛季</button>' : '')
    + '<button class="btn primary" id="b-new">开启新赛季</button>'
    + '<div class="row"><button class="btn" id="b-gallery">球员图鉴</button><button class="btn" id="b-boards">传奇榜</button></div>'
    + '<div class="row"><button class="btn" id="b-shop">生涯规划商店</button><button class="btn" id="b-code">存档码 / 种子</button></div>'
    + '<button class="btn ghost" id="b-rules">归队规则与玩法</button></div>'
    + '<div class="foot">'+C.GAME_NAME+' '+C.VERSION+'</div>';
    bind('b-new', ()=>{ view='setup'; render(); });
    if(has) bind('b-continue', ()=>{ S = Save.peek(); resumeView(); });
    bind('b-gallery', ()=>{ if(!S){ S = Save.peek(); } view='gallery'; render(); });
    bind('b-boards', ()=>{ view='boards'; render(); });
    bind('b-shop', ()=>{ view='shop'; render(); });
    bind('b-code', showCodeModal);
    bind('b-rules', showRules);
  }
  function resumeView(){
    if(!S){ view='home'; return render(); }
    if(S.phase==='ending'){ view='ending'; }
    else if(S.phase==='event'){ view='event'; }
    else if(S.phase==='draft'){ view='draft'; }

  }
  function bind(id, fn){ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); }
  // —— 开局设置 ——
  function renderSetup(){
    app.innerHTML = '<div class="paper"><h2>新赛季 · 选秀档案</h2>'
    + '<p>出身（选秀顺位）</p><div id="origins">'

    + C.POSITIONS.map(p=>'<button class="btn small" data-pos="'+p.id+'">'+p.name+'</button>').join('')

    + '<button class="btn ghost" id="b-back">返回</button></div>';

    app.querySelectorAll('[data-origin]').forEach(el=>el.addEventListener('click', ()=>{ originId=el.dataset.origin; markSel('[data-origin]', el); }));
    app.querySelectorAll('[data-pos]').forEach(el=>el.addEventListener('click', ()=>{ posId=el.dataset.pos; markSel('[data-pos]', el); }));
    bind('b-back', ()=>{ view='home'; render(); });
    bind('b-start', ()=>{
      const seedIn = document.getElementById('seed-in').value.trim();

  }
  function markSel(sel, el){ app.querySelectorAll(sel).forEach(x=>x.style.borderColor=''); el.style.borderColor='#b3402a'; }
  // —— 选秀台 ——
  function renderDraft(){
    if(!S || !S.batch){ view='home'; return render(); }
    const batch = S.batch.map(e=>G.candidateObj(e));
    let h = '<div style="padding:12px 10px 0"><div class="kicker">选秀台 · 第 '+(S.draftRound+1)+' / '+C.DRAFT_ROUNDS+' 轮</div></div>'
    + resBar()
    + '<div class="paper"><h3>本轮：'+esc(S.batchTeam)+'（种子 '+esc(S.seed)+'）</h3><div class="cands">';

      h += '<div class="cand'+(selCand===i?' sel':'')+'" data-cand="'+i+'"><img src="'+portrait(p)+'" alt=""><div class="nm">'+esc(p.name)+(p.isPeak?' <span style="color:#b3402a">巅峰</span>':'')+'</div><div class="meta">'+esc(p.team)+' · '+p.tier+'档 · 峰值 '+esc(p.window)+'</div><div class="meta">'+esc(p.note)+'</div></div>';
    });
    h += '</div>';
    if(selCand>=0){
      const p = batch[selCand];
      h += '<h3>锁定 '+esc(p.name)+' 的一项能力</h3><div class="attrgrid">';
      for(let i=0;i<12;i++){
        const taken = !!S.attrSrc[i];
        h += '<button class="attrbtn" data-attr="'+i+'" '+(taken?'disabled':'')+'>'+C.ATTRS[i]+' <b>'+p.stats[i]+'</b>'+(p.special&&p.special.attr===i?'<br>绝活：'+(p.special.kind==='floor'?'下限 '+p.special.value:'加成 +'+p.special.value):'')+(taken?'<br>已锁定':'')+'</button>';
      }
      h += '</div>';
    }
    h += '<div class="row"><button class="btn" id="b-swap">🔀 换一批（余 '+S.swapsLeft+'）</button>'
      + '<button class="btn green" id="b-directed">'+(S.directedReady?'🎯 定向招募已就绪':'🎯 定向招募·看广告')+'</button></div>'
      + '<h3>我的拼图</h3>'+slotsHtml()+'</div>';
    app.innerHTML = h;
    app.querySelectorAll('[data-cand]').forEach(el=>el.addEventListener('click', ()=>{ selCand=+el.dataset.cand; render(); }));
    app.querySelectorAll('[data-attr]').forEach(el=>el.addEventListener('click', ()=>{
      const r = G.draftPick(S, selCand, +el.dataset.attr);
      if(r.ok){ selCand=-1; saveNow('draft-pick'); if(S.phase==='battle'){ view='battle'; } render(); }
    }));
    bind('b-swap', ()=>{ const r=G.rerollBatch(S); if(r.ok){ selCand=-1; saveNow('draft-reroll'); render(); } else alert('免费换一批次数已用完'); });
    bind('b-directed', async ()=>{
      if(S.directedReady){ showTeamPicker(); return; }
      const res = await Ads.watch('directed', (t)=>G.applyAdGrant(S,t));
      saveNow('ad-directed'); if(S.directedReady){ showTeamPicker(); } render();
    });
  }
  function showTeamPicker(){
    modal('<h3>定向招募 · 自选时代</h3>' + C.TEAMS.map(t=>{
      const left = window.BK_DATA.players.filter(p=>p.team===t && !S.attrSrc.includes(p.name)).length;
      return '<button class="btn small" data-team="'+t+'" '+(left<=0?'disabled':'')+'>'+t+'（尚余 '+left+' 人）</button>';
    }).join('') + '<button class="btn ghost" id="m-cancel">先不选（资格保留）</button>');
    document.querySelectorAll('[data-team]').forEach(el=>el.addEventListener('click', ()=>{ G.directedDraft(S, el.dataset.team); selCand=-1; saveNow('directed-pick'); closeModal(); render(); }));
    bind('m-cancel', closeModal);
  }
  // —— 战斗 ——
  function settleHtml(rec){
    if(!rec) return '';
    let h = '<div class="settle"><b>结算</b>：';
    if(rec.kind==='battle'){
      const b = window.BK_BATTLES[rec.battle-1];
      if(rec.pre) h += '负荷冲突 '+rec.pre.load+' 项，健康 '+rec.pre.health+'；';
      if(rec.rate!=null) h += '判定 '+rec.roll+' / 成功率 '+rec.rate+'% → <b>'+(rec.success?'成功':'失败')+'</b>（'+({great:'大胜',win:'胜',hold:'僵持',lose:'败',fixed:'固定'})[rec.grade]+'）';
      else h += '固定结算';
      if(rec.scene) h += '；🌟 高光时刻 +1';
      if(rec.rest) h += '；休整健康 +'+rec.rest;
      if(rec.selfPenalty) h += '；⚠ 轮休流言触发';
      if(rec.finals) h += '；终局门槛 战力需求 '+rec.finals.needPower+(rec.finals.needMerit?' / 功勋需求 '+rec.finals.needMerit:'');
      h += '。结果已落盘，退出重进不会重打。';
    } else if(rec.kind==='event'){
      h += '事件「'+esc((window.BK_EVENTS.find(e=>e.id===rec.event)||{}).name||'')+'」已结算并落盘。';
      if(rec.rate!=null) h += '判定 '+rec.roll+' / '+rec.rate+'% → '+(rec.success?'成功':'失败')+'。';
      if(rec.trainAttr!=null) h += '历练：'+C.ATTRS[rec.trainAttr]+' +1。';
    }
    return h+'</div>';
  }
  function renderBattle(){
    if(!S){ view='home'; return render(); }
    if(S.phase==='ending'){ view='ending'; return render(); }
    if(S.phase==='event'){ view='event'; return render(); }
    const b = G.battleDef(S); if(!b){ view='ending'; return render(); }

    // 已落盘结算先行展示（恢复路径）
    if(S.lastSettle && S._settleShown!==S.battleIdx && S.lastSettle.battle && S.lastSettle.battle < b.id){ h += settleHtml(S.lastSettle); }
    else if(S.lastSettle && S.lastSettle.kind==='event' && S._settleShown!==S.battleIdx){ h += settleHtml(S.lastSettle); }
    h += '<div class="paper"><h2>'+esc(b.name)+'</h2><p>'+esc(b.brief)+'</p>';
    if(S.fateBuff>0) h += '<p>🌟 巨星时刻生效中（余 '+S.fateBuff+' 战，判定 +8）</p>';
    if(S.checkMod) h += '<p>更衣室状态：判定修正 '+(S.checkMod.value>0?'+':'')+S.checkMod.value+'（余 '+S.checkMod.battles+' 战）</p>';

      const o = b[k]; if(!o) return;
      let extra = '';
      if(o.attr!=null){ const rate = F.checkRate(S, o.attr, {}); extra = '（查'+C.ATTRS[o.attr]+' '+F.effAttr(S,o.attr)+' · 基础成功率 '+rate+'%）'; }
      if(o.kind==='identity') extra = '（战术身份，锁定后全季生效）';
      if(o.kind==='finals') extra = '（终局抉择，见结局门槛）';
      h += '<button class="btn" data-opt="'+k+'">'+k+' · '+esc(o.label)+extra+'</button>';
    });
    h += '<label class="chk"><input type="checkbox" id="gamble"> 拼一把（成功率减半，效果与功勋翻倍，失败额外 健康-3/战力-50）</label>';
    h += '<div class="row"><button class="btn small green" id="ad-fate">🌟 巨星时刻（广告）</button><button class="btn small green" id="ad-heal">🩹 队医补给（广告）</button></div>';
    if(S.lastSettle && S.lastSettle.kind==='battle' && S.lastSettle.success===false && !S.rewindArmed) h += '<button class="btn small" id="ad-rewind">↩ 改命（广告：免除上战亲为失败计数）</button>';
    if(S.rewindArmed) h += '<button class="btn small primary" id="use-rewind">使用改命（回健康+8，消上战失败计数）</button>';
    h += '<button class="btn ghost" id="b-home">回首页</button></div>';
    app.innerHTML = h;
    S._settleShown = S.battleIdx;
    app.querySelectorAll('[data-opt]').forEach(el=>el.addEventListener('click', ()=>{
      const gamble = document.getElementById('gamble').checked;
      const r = G.chooseBattle(S, el.dataset.opt, { gamble });
      if(r.ok){
        Save.save('battle-settle'); // 判定落盘：结算即存
        S._settleShown = -1;
        if(S.phase==='ending'){ view='ending'; render(); }
        else if(S.phase==='event'){ view='event'; render(); }
        else render();
      }
    }));
    bind('ad-fate', async ()=>{ await Ads.watch('fate', t=>G.applyAdGrant(S,t)); saveNow('ad-fate'); render(); });
    bind('ad-heal', async ()=>{ await Ads.watch('heal', t=>G.applyAdGrant(S,t)); saveNow('ad-heal'); render(); });
    bind('ad-rewind', async ()=>{ await Ads.watch('rewind', t=>G.applyAdGrant(S,t)); saveNow('ad-rewind'); render(); });
    bind('use-rewind', ()=>{ G.useRewind(S); saveNow('rewind-use'); render(); });
    bind('b-home', ()=>{ view='home'; render(); });
  }
  // —— 事件 ——
  function renderEvent(){
    const ev = window.BK_EVENTS.find(e=>e.id===S.pendingEvent);
    if(!ev){ view='battle'; return render(); }
    let h = '<div style="padding:12px 10px 0"><div class="kicker">赛后事件</div></div>' + resBar()
    + '<div class="paper"><h2>'+esc(ev.name)+'</h2><p>'+esc(ev.brief)+'</p>';
    ['A','B'].forEach(k=>{ const o=ev[k]; if(o) h += '<button class="btn" data-ev="'+k+'">'+k+' · '+esc(o.label)+'</button>'; });
    h += '</div>';
    app.innerHTML = h;
    app.querySelectorAll('[data-ev]').forEach(el=>el.addEventListener('click', ()=>{
      const r = G.chooseEvent(S, el.dataset.ev);
      if(r.ok){ Save.save('event-settle'); S._settleShown=-1; if(S.phase==='ending'){ view='ending'; } else { view='battle'; } render(); }
    }));
  }
  // —— 结局 ——
  function renderEnding(){
    const def = window.BK_ENDINGS.find(e=>e.id===S.endingId) || {};
    let h = '<div style="padding:14px 10px 0"><div class="kicker">赛季结算</div></div>'
    + '<div class="paper"><h2>'+esc(def.name||'赛季结束')+'</h2><p>'+esc(def.desc||'')+'</p>'
    + (S.flags.bountyTag ? '<p>🏷 结算标签：<b>抱团夺冠</b>（所夺 S 档来源集中，争议照常计入传奇值）</p>' : '')
    + ((S.endingId==='champion_top'||S.endingId==='champion_piece'||S.endingId==='lying_champ') ? '<p>📖 后记：<b>王朝序章</b>——二周目可挑战连冠。</p>' : '')

    + '<h3>我的拼图</h3>'+slotsHtml()
    + '<div class="row"><button class="btn primary" id="b-poster">生成构筑海报</button><button class="btn" id="b-submit"'+(S.submitted?' disabled':'')+'>'+(S.submitted?'已提交上榜':'提交成绩上榜')+'</button></div>'
    + '<div class="row"><button class="btn" id="b-boards2">看排行榜</button><button class="btn" id="b-again">再来一局</button></div>';
    h += '</div>';
    app.innerHTML = h;
    bind('b-poster', drawPoster);
    bind('b-submit', async ()=>{
      const btn = document.getElementById('b-submit'); if(btn) btn.disabled = true;
      try{
        await LB.submitResult({ score: S.legend, ending: def.name, champion: ['champion_top','champion_piece','lying_champ'].includes(S.endingId), exitBattle: Math.min(20, S.battleIdx||20) });
        S.submitted = true; saveNow('lb-submit'); render();
      }catch(e){ if(btn) btn.disabled = false; }
    });
    bind('b-boards2', ()=>{ view='boards'; render(); });
    bind('b-again', ()=>{ Save.clear(); S=null; view='setup'; render(); });
  }
  function drawPoster(){
    const cv = document.createElement('canvas'); cv.width=750; cv.height=1080;
    const x = cv.getContext('2d');
    x.fillStyle='#f4efe3'; x.fillRect(0,0,750,1080);
    x.fillStyle='#1d2733'; x.fillRect(0,0,750,120);
    x.fillStyle='#f4efe3'; x.font='bold 40px sans-serif'; x.fillText('巨星拼图 · 构筑海报', 36, 62);
    x.font='22px sans-serif'; x.fillText('12 项能力与来源球星 — '+esc('')+ (window.BK_ENDINGS.find(e=>e.id===S.endingId)||{}).name, 36, 98);
    x.fillStyle='#1d2733'; x.font='24px sans-serif';
    for(let i=0;i<12;i++){
      const y = 190 + i*56;
      x.fillText(C.ATTRS[i], 40, y);
      x.font='bold 30px sans-serif'; x.fillText(String(S.attrs[i]), 150, y);
      x.font='22px sans-serif'; x.fillText(S.attrSrc[i]||'—', 230, y);
    }
    x.font='bold 30px sans-serif'; x.fillText('传奇值 '+S.legend+' · 总评 '+F.overall(S), 40, 920);
    x.font='20px sans-serif'; x.fillText('种子 '+S.seed+' · '+C.GAME_NAME+' '+C.VERSION, 40, 970);
    modal('<h3>构筑海报</h3><img src="'+cv.toDataURL('image/png')+'" style="width:100%"><a class="btn primary" download="juxing-poster.png" href="'+cv.toDataURL('image/png')+'">下载海报 PNG</a><button class="btn ghost" id="m-close">关闭</button>');
    bind('m-close', closeModal);
  }
  // —— 图鉴 ——
  function renderGallery(){
    const t0 = performance.now();
    let h = '<div class="paper"><h2>球员图鉴（90 人）</h2><div class="grid2">';
    for(const team of C.TEAMS){ /* 分队顺序即数据顺序 */ }
    window.BK_DATA.players.forEach(p=>{
      h += '<div class="gcard"><img src="'+portrait(p)+'" alt=""><div><b>'+esc(p.name)+'</b></div><div>'+esc(p.team)+' · '+p.tier+'档 · 峰值 '+esc(p.window)+'</div><div>'+esc(p.note)+'</div><div>强项：'+topAttrs(p)+'</div></div>';
    });
    h += '</div><button class="btn ghost" id="b-back2">返回</button></div>';
    app.innerHTML = h;
    const dt = performance.now()-t0;
    app.querySelector('.paper').insertAdjacentHTML('beforeend', '<p style="font-size:12px">图鉴渲染耗时 '+dt.toFixed(1)+'ms（90 人）</p>');
    bind('b-back2', ()=>{ view = S && S.phase!=='ending' && S.phase ? (S.phase==='draft'?'draft':'battle') : 'home'; if(!S) view='home'; render(); });
  }
  function topAttrs(p){ const idx = p.stats.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,3); return idx.map(([v,i])=>C.ATTRS[i]+v).join(' / '); }
  // —— 排行榜 ——
  function renderBoards(){
    const b = LB.boards();
    const tabs = [[b.best,'传奇总榜'],[b.worst,'最水榜'],[b.dbest,'今日最强'],[b.dworst,'今日最水']];
    let h = '<div class="paper"><h2>传奇榜</h2><div class="row">'
      + tabs.map(([id,nm])=>'<button class="btn small" data-tab="'+id+'">'+nm+'</button>').join('') + '</div><div id="lb-body">加载中…</div>'
      + '<button class="btn ghost" id="b-back3">返回</button></div>';
    app.innerHTML = h;
    const load = async (board)=>{
      const res = await LB.load(board);
      const list = (res && res.entries) || [];
      let t = '<table class="lb"><tr><th>#</th><th>玩家</th><th>传奇值</th><th>结局</th></tr>';
      list.forEach((e,i)=>{ t += '<tr><td>'+(i+1)+'</td><td>'+esc(e.displayName)+'</td><td>'+e.score+'</td><td>'+esc(e.ending||'')+(typeof e.deathCh==='number'?' · 止步第 '+e.deathCh+' 战':'')+'</td></tr>'; });
      if(!list.length) t += '<tr><td colspan="4">暂无记录，先打一局上榜</td></tr>';
      document.getElementById('lb-body').innerHTML = t + '<p style="font-size:12px">共 '+((res&&res.total)||0)+' 条</p>';
    };
    app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=>load(el.dataset.tab)));
    load(b.best);
    bind('b-back3', ()=>{ view='home'; render(); });
  }
  // —— 商店 ——
  function renderShop(){
    const meta = window.BK_Meta.load();
    let h = '<div class="paper"><h2>生涯规划商店</h2><p>生涯功勋点：<b>'+meta.points+'</b>（每局功勋结算入账）· 已购：'+(meta.shopOwned.length?meta.shopOwned.map(id=>(C.SHOP.find(x=>x.id===id)||{}).name).join('、'):'无')+'</p>';
    C.SHOP.forEach(it=>{
      const owned = meta.shopOwned.includes(it.id);
      h += '<button class="btn small" data-buy="'+it.id+'" '+(owned||meta.points<it.price?'disabled':'')+'>'+it.name+' · '+it.price+' 点 — '+it.desc+(owned?'（已购）':'')+'</button>';
    });
    h += '<button class="btn ghost" id="b-back4">返回</button></div>';
    app.innerHTML = h;
    app.querySelectorAll('[data-buy]').forEach(el=>el.addEventListener('click', ()=>{
      const it = C.SHOP.find(x=>x.id===el.dataset.buy); const m = window.BK_Meta.load();
      if(m.points>=it.price && !m.shopOwned.includes(it.id)){ m.points-=it.price; m.shopOwned.push(it.id); window.BK_Meta.save(m); if(S) S.shopOwned = m.shopOwned; render(); }
    }));
    bind('b-back4', ()=>{ view='home'; render(); });
  }
  // —— 存档码 / 规则 ——
  function showCodeModal(){
    const cur = Save.peek();
    const code = cur ? btoa(unescape(encodeURIComponent(JSON.stringify(cur)))) : '';
    modal('<h3>存档码 / 种子</h3><p>种子：<b>'+(cur?esc(cur.seed):'无进行中存档')+'</b>（种子只定随机流，进度用存档码）</p>'
    + '<p>导出存档码（长按手动复制，虎扑禁程序化剪贴板）：</p><textarea readonly>'+code+'</textarea>'
    + '<p>导入存档码：</p><textarea id="imp"></textarea><button class="btn primary" id="m-import">导入并继续</button>'
    + '<button class="btn ghost" id="m-close2">关闭</button>');
    bind('m-close2', closeModal);
    bind('m-import', ()=>{
      try{ const obj = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim())))); S = Save.adopt(obj); Save.save('import'); closeModal(); resumeView(); }
      catch(e){ alert('存档码无效'); }
    });
  }
  function showRules(){
    modal('<h3>玩法与归队规则</h3><p>12 轮选秀：每轮一支时代队出 5 人，选 1 人锁定他的 1 项能力拼到自己身上；打穿 20 个赛季关键战役，按止步轮次与个人贡献结算结局，传奇值上榜。</p>'
    + '<p><b>归队规则</b>：五年峰值窗口多数决——取球员最好的连续五季，看落在哪十年占多数。官方范例：詹姆斯峰值窗口 2009–2013，归 10 年代队。交界人卡面有「崛起于 X 年代末」注脚；中国球员归国际纵队；新世代队为截至 2026 赛季的冻结快照，只加不换。</p>'
    + '<p>判定：成功率 = 35+(属性-60)×0.8-负荷冲突×3+修正，亲为且属性≥85 成功可得高光时刻。</p><button class="btn ghost" id="m-close3">关闭</button>');
    bind('m-close3', closeModal);
  }
  // —— 启动：先核对广告 PENDING，再恢复（平台计数刷新后再核对一次） ——
  function bootGrant(t){ const s = Save.peek(); if(s){ G.applyAdGrant(s, t); Save.save('ad-settle-boot'); } }
  Ads.settleAll(bootGrant);
  Ads.refreshCount().then(()=>Ads.settleAll(bootGrant));
  S = Save.peek();
  if(S && S.phase && S.phase!=='origin'){ resumeView(); } else { view='home'; render(); }
})();
</script>
</body>
</html>
